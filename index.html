}

function repeatLast(name){
  const ex = data[name];
  if(!ex.entries.length) return;
  const last = ex.entries[ex.entries.length - 1];
  if(ex.trackBy === "duration"){
    const m = document.getElementById("f-minutes");
    if(m) m.value = last.minutes;
    const dist = document.getElementById("f-distance");
    if(dist && last.distance != null) dist.value = last.distance;
    const spd = document.getElementById("f-speed");
    if(spd && last.speed != null) spd.value = last.speed;
    const incl = document.getElementById("f-incline");
    if(incl && last.incline != null) incl.value = last.incline;
  } else {
    const w = document.getElementById("f-weight");
    const s = document.getElementById("f-sets");
    const r = document.getElementById("f-reps");
    if(w) w.value = last.weight;
    if(s) s.value = last.sets;
    if(r) r.value = last.reps;
  }
  const d = document.getElementById("f-difficulty");
  if(d && last.difficulty) d.value = last.difficulty;
}

function chartValue(e, ex){
  if(ex.trackBy === "weight") return e.weight;
  if(ex.trackBy === "duration") return e.minutes;
  return e.reps;
}

function suggestionValue(suggestion, ex){
  if(ex.trackBy === "weight") return suggestion.weight;
  if(ex.trackBy === "duration") return suggestion.minutes;
  return suggestion.reps;
}

// Retroactively flags any point where the weight dropped right after a
// 3+ session stall at the prior weight - i.e. a deload, whether the user
// followed the app's suggestion exactly or just dropped weight themselves.
function computeDeloadFlags(ex){
  const entries = ex.entries;
  const flags = new Array(entries.length).fill(false);
  if(ex.trackBy !== "weight") return flags;
  const targetReps = effectiveTargetReps(ex);
  for(let i = 1; i < entries.length; i++){
    const prev = entries[i-1], cur = entries[i];
    if(cur.weight < prev.weight){
      let missStreak = 0;
      for(let j = i-1; j >= 0; j--){
        const e = entries[j];
        if(e.weight === prev.weight && e.reps < targetReps) missStreak++;
        else break;
      }
      if(missStreak >= 3) flags[i] = true;
    }
  }
  return flags;
}

// ---------- chart quarters (calendar-aligned: Q1 Jan-Mar ... Q4 Oct-Dec) ----------
const QUARTER_MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function currentQuarterIndex(){
  const d = new Date();
  return d.getFullYear() * 4 + Math.floor(d.getMonth() / 3);
}
function quarterFromIndex(qIndex){
  const year = Math.floor(qIndex / 4);
  const q = qIndex - year * 4;
  return { year, q };
}
function quarterDateRange(qIndex){
  const { year, q } = quarterFromIndex(qIndex);
  const startMonth = q * 3;
  const start = new Date(Date.UTC(year, startMonth, 1));
  const end = new Date(Date.UTC(year, startMonth + 3, 0, 23, 59, 59, 999));
  return { start, end, year, q };
}
function dateInQuarter(dateStr, qIndex){
  if(!dateStr) return false;
  const [y, m, d] = dateStr.split("-").map(Number);
  const t = Date.UTC(y, m - 1, d);
  const { start, end } = quarterDateRange(qIndex);
  return t >= start.getTime() && t <= end.getTime();
}
function fmtQuarterRange(qIndex){
  const { start, end, year, q } = quarterDateRange(qIndex);
  const s = `${QUARTER_MONTH_ABBR[start.getUTCMonth()]} ${start.getUTCDate()}`;
  const e = `${QUARTER_MONTH_ABBR[end.getUTCMonth()]} ${end.getUTCDate()}`;
  return `Q${q + 1} ${year} · ${s} – ${e}`;
}
function shiftChartQuarter(chartKey, delta){
  chartQuarterOffset[chartKey] = (chartQuarterOffset[chartKey] || 0) + delta;
  render();
}

// ---------- chart (pure inline SVG, no external library) ----------
function renderChart(ex, suggestion, isRealExercise, chartKey){
  const W = 320, H = 130, padR = 14, padT = 10, padB = 20;
  const entries = ex.entries;
  const deloadFlagsFull = isRealExercise ? computeDeloadFlags(ex) : new Array(entries.length).fill(false);

  const offset = chartQuarterOffset[chartKey] || 0;
  const qIndex = currentQuarterIndex() + offset;
  const points = entries
    .map((e, i) => ({ x: i, y: chartValue(e, ex), entry: e, deload: deloadFlagsFull[i] }))
    .filter(p => dateInQuarter(p.entry.date, qIndex));
  const deloadFlags = points.map(p => p.deload);

  let nav = `<div class="chart-quarter-nav">
    <button class="tool-btn" onclick="shiftChartQuarter('${chartKey.replace(/'/g,"\\'")}', -1)">‹ Prev</button>
    <span class="chart-quarter-label">${fmtQuarterRange(qIndex)}</span>
    <button class="tool-btn" ${offset >= 0 ? "disabled" : ""} onclick="shiftChartQuarter('${chartKey.replace(/'/g,"\\'")}', 1)">Next ›</button>
  </div>`;
  if(!points.length){
    return nav + `<p style="font-size:0.76rem;color:var(--slate);font-style:italic;margin:0.4rem 0 0;">No sessions logged this quarter.</p>`;
  }

  const hasProjection = !!suggestion && offset === 0;
  const projY = hasProjection ? suggestionValue(suggestion, ex) : null;

  const allY = points.map(p=>p.y).concat(hasProjection ? [projY] : []);
  const forceStep = ex.trackBy === "weight" ? undefined : 1;
  const { lo, hi, step } = niceTicks(allY, forceStep);
  const tickValues = ticksBetween(lo, hi, step);

  // Left padding scales with how wide the y-axis labels actually are,
  // so large numbers (like total volume) don't overflow past the edge.
  const tickLabels = tickValues.map(v => String(v));
  const maxLabelLen = tickLabels.reduce((m,s) => Math.max(m, s.length), 1);
  const padL = 14 + maxLabelLen * 5.5;

  const n = points.length + (hasProjection ? 1 : 0);
  const xStep = n > 1 ? (W - padL - padR) / (n - 1) : 0;

  function xAt(i){ return padL + i * xStep; }
  function yAt(v){ return padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo || 1)); }

  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;

  // gridlines + y labels
  tickValues.forEach(v => {
    const y = yAt(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--chart-grid)" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${y+3}" font-size="8" fill="var(--chart-axis)" text-anchor="end" font-family="var(--font-mono)">${v}</text>`;
  });

  // solid line through actual points
  if(points.length > 1){
    const path = points.map((p,i) => `${i===0?'M':'L'}${xAt(i).toFixed(1)},${yAt(p.y).toFixed(1)}`).join(" ");
    svg += `<path d="${path}" fill="none" stroke="var(--chart-line)" stroke-width="2.5"/>`;
  }
  // dots + x labels for actual points - deload gets a hollow red marker,
  // under 3 sets gets dark red, missed target reps gets red, extra reps/sets
  // (that actually hit target) gets green - each with a small sets×reps label
  points.forEach((p,i) => {
    const isDeload = deloadFlags[i];
    const targetReps = ex.targetReps || 8;
    const isUnder = isRealExercise && !isDeload && ex.trackBy !== "duration" && p.entry.sets < 3;
    const isMissed = isRealExercise && !isDeload && !isUnder && ex.trackBy !== "duration" && p.entry.reps < targetReps;
    const isExtra = isRealExercise && !isDeload && !isUnder && !isMissed && ex.trackBy !== "duration" &&
      (p.entry.reps > targetReps || p.entry.sets > 3);
    const titleText = `${fmtDate(p.entry.date)}: ${formatEntryValue(p.entry, ex)}${p.entry.note?" - "+p.entry.note:""}${isDeload?" - deload":""}${isExtra?" - extra volume":""}${isUnder?" - under 3 sets":""}${isMissed?" - missed target reps":""}`;

    function labelWithHalo(text, color){
      const labelY = Math.max(padT + 7, yAt(p.y) - 8);
      const w = text.length * 4.6 + 3;
      svg += `<rect x="${(xAt(i)-w/2).toFixed(1)}" y="${(labelY-6.5).toFixed(1)}" width="${w.toFixed(1)}" height="9" rx="2" fill="var(--chart-label-halo)" opacity="0.85"/>`;
      svg += `<text x="${xAt(i).toFixed(1)}" y="${labelY.toFixed(1)}" font-size="7.5" fill="${color}" font-weight="700" text-anchor="middle" font-family="var(--font-mono)">${text}</text>`;
    }

    if(isDeload){
      svg += `<line x1="${xAt(i).toFixed(1)}" y1="${padT}" x2="${xAt(i).toFixed(1)}" y2="${H-padB}" stroke="var(--danger)" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>`;
      svg += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" r="5" fill="var(--chart-white)" stroke="var(--danger)" stroke-width="2"><title>${titleText}</title></circle>`;
    } else if(isUnder){
      svg += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" r="4.5" fill="var(--chart-under)"><title>${titleText}</title></circle>`;
      labelWithHalo(`${p.entry.sets}×${p.entry.reps}`, "var(--chart-under)");
    } else if(isMissed){
      svg += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" r="4.5" fill="var(--chart-missed)"><title>${titleText}</title></circle>`;
      labelWithHalo(`${p.entry.sets}×${p.entry.reps}`, "var(--chart-missed)");
    } else if(isExtra){
      svg += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" r="4.5" fill="var(--chart-extra)"><title>${titleText}</title></circle>`;
      labelWithHalo(`${p.entry.sets}×${p.entry.reps}`, "var(--chart-extra)");
    } else {
      svg += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" r="4" fill="var(--chart-line)"><title>${titleText}</title></circle>`;
    }
    svg += `<text x="${xAt(i).toFixed(1)}" y="${H-4}" font-size="8" fill="${isDeload?'var(--danger)':'var(--chart-axis)'}" text-anchor="middle" font-family="var(--font-mono)">${isDeload?'D':p.entry.label}</text>`;
  });

  // dashed projection segment
  if(hasProjection && points.length){
    const lastP = points[points.length-1];
    const x1 = xAt(points.length-1), y1 = yAt(lastP.y);
    const x2 = xAt(points.length), y2 = yAt(projY);
    svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--chart-line)" stroke-width="2" stroke-dasharray="5 4"/>`;
    const projLabel = ex.trackBy==="weight" ? `${suggestion.weight}lbs ${repLabel(suggestion.sets,suggestion.reps,ex.unit)}` : ex.trackBy==="duration" ? `${suggestion.minutes} min` : repLabel(suggestion.sets,suggestion.reps,ex.unit);
    svg += `<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="4" fill="var(--chart-white)" stroke="var(--chart-line)" stroke-width="2"><title>Suggested next: ${projLabel}</title></circle>`;
    svg += `<text x="${x2.toFixed(1)}" y="${H-4}" font-size="8" fill="var(--chart-line)" text-anchor="middle" font-family="var(--font-mono)">Next</text>`;
  }

  svg += `</svg>`;
  return nav + svg;
}

// ---------- overview ----------
function guessDayForNames(names){
  let best = null, bestOverlap = 0;
  ["full","upper","lower","extra"].forEach(d => {
    const overlap = DAY_ORDER[d].filter(n => names.includes(n)).length;
    if(overlap > bestOverlap){ bestOverlap = overlap; best = d; }
  });
  return best;
}

function getSessionsByDate(){
  const map = {};
  Object.entries(data).forEach(([name, ex]) => {
    if(ex.trackBy === "checklist") return;
    ex.entries.forEach(e => {
      if(!e.date) return;
      if(!map[e.date]) map[e.date] = [];
      if(!map[e.date].includes(name)) map[e.date].push(name);
    });
  });
  return map;
}

const CAL_MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const CAL_DAY_LETTERS = { full:"F", upper:"U", lower:"L", extra:"E" };
const CAL_DAY_COLORS = { full:"var(--accent-2)", upper:"var(--amber)", lower:"var(--emerald)", extra:"var(--slate)" };

function prevMonth(){
  calendarMonth--;
  if(calendarMonth < 0){ calendarMonth = 11; calendarYear--; }
  calendarSelectedDate = null;
  render();
}
function nextMonth(){
  calendarMonth++;
  if(calendarMonth > 11){ calendarMonth = 0; calendarYear++; }
  calendarSelectedDate = null;
  render();
}
function selectCalendarDate(dateStr){
  calendarSelectedDate = calendarSelectedDate === dateStr ? null : dateStr;
  render();
}
function toggleCalendarExpanded(){
  calendarExpanded = !calendarExpanded;
  render();
}
function toggleLastSessionExpanded(){
  lastSessionExpanded = !lastSessionExpanded;
  render();
}
function toggleVolumeExpanded(){
  volumeExpanded = !volumeExpanded;
  render();
}

function renderCalendar(){
  const sessionsByDate = getSessionsByDate();
  const firstOfMonth = new Date(calendarYear, calendarMonth, 1);
  const daysInMonth = new Date(calendarYear, calendarMonth+1, 0).getDate();
  const startWeekday = firstOfMonth.getDay();
  const todayStr = todayISO();
  const monthPrefix = `${calendarYear}-${String(calendarMonth+1).padStart(2,"0")}-`;
  const sessionsThisMonth = Object.keys(sessionsByDate).filter(d => d.startsWith(monthPrefix)).length;

  let html = `<div class="card">`;
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${calendarExpanded?'0.6rem':'0'};">
    <button class="tool-btn" onclick="prevMonth()">‹ Prev</button>
    <h3 class="section" style="margin:0;">${CAL_MONTH_NAMES[calendarMonth]} ${calendarYear}</h3>
    <button class="tool-btn" onclick="nextMonth()">Next ›</button>
  </div>`;

  html += `<div onclick="toggleCalendarExpanded()" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:0.78rem;color:var(--slate);padding:${calendarExpanded?'0':'0.3rem 0'};">
    <span>${sessionsThisMonth} session${sessionsThisMonth===1?'':'s'} this month</span>
    <span style="color:var(--amber);font-weight:600;">${calendarExpanded ? 'Hide calendar ▲' : 'Show calendar ▼'}</span>
  </div>`;

  if(calendarExpanded){
    html += `<div class="cal-grid cal-header" style="margin-top:0.5rem;">` + ["S","M","T","W","T","F","S"].map(d => `<div>${d}</div>`).join("") + `</div>`;
    html += `<div class="cal-grid">`;
    for(let i = 0; i < startWeekday; i++) html += `<div class="cal-cell empty"></div>`;
    for(let day = 1; day <= daysInMonth; day++){
      const dateStr = `${calendarYear}-${String(calendarMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const namesLogged = sessionsByDate[dateStr];
      const dayType = namesLogged ? guessDayForNames(namesLogged) : null;
      const letter = dayType ? CAL_DAY_LETTERS[dayType] : "";
      const color = dayType ? CAL_DAY_COLORS[dayType] : "transparent";
      const isToday = dateStr === todayStr;
      const isSelected = dateStr === calendarSelectedDate;
      html += `<div class="cal-cell${isToday?' today':''}${namesLogged?' has-session':''}${isSelected?' selected':''}" ${namesLogged ? `onclick="selectCalendarDate('${dateStr}')"` : ''}>
        <span class="cal-daynum">${day}</span>
        ${letter ? `<span class="cal-badge" style="background:${color};">${letter}</span>` : ''}
      </div>`;
    }
    html += `</div>`;

    if(calendarSelectedDate && sessionsByDate[calendarSelectedDate]){
      const names = sessionsByDate[calendarSelectedDate];
      html += `<div class="cal-detail"><p style="font-weight:600;font-size:0.8rem;margin:0 0 0.35rem;">${fmtDate(calendarSelectedDate)}</p>`;
      names.forEach(n => {
        const ex = data[n];
        const entry = ex.entries.slice().reverse().find(e => e.date === calendarSelectedDate);
        if(entry){
          html += `<div style="font-size:0.78rem;color:var(--slate);font-family:var(--font-mono);">${n} - ${formatEntryValue(entry, ex)}</div>`;
        }
      });
      html += `</div>`;
    }

    const legendTitles = { ...DAY_TITLES, extra: "Extra" };
    html += `<div class="cal-legend">`;
    Object.keys(CAL_DAY_LETTERS).forEach(d => {
      html += `<span><span class="cal-badge" style="background:${CAL_DAY_COLORS[d]};">${CAL_DAY_LETTERS[d]}</span> ${legendTitles[d]}</span>`;
    });
    html += `</div>`;
  }

  const recovery = computeRecoveryReadiness();
  if(recovery){
    const readinessColor = recovery.readiness >= 7 ? "var(--emerald)" : recovery.readiness >= 4 ? "var(--amber)" : "var(--danger)";
    html += `<p style="font-size:0.76rem;color:var(--slate);margin:0.6rem 0 0;padding-top:0.5rem;border-top:1px dashed var(--line);">
      Recovery readiness: <b style="color:${readinessColor};font-family:var(--font-mono);">${recovery.readiness}/10</b>
      - ${recovery.daysSince} day${recovery.daysSince===1?'':'s'} rested${recovery.neededRestDays > 0 ? `, ~${recovery.neededRestDays} more suggested` : ', should be ready'}
    </p>`;
  }

  html += `</div>`;
  return html;
}

function getLastSessionDate(){
  let maxDate = null;
  Object.values(data).forEach(ex => {
    if(ex.trackBy === "checklist") return;
    ex.entries.forEach(e => {
      if(e.date && (!maxDate || e.date > maxDate)) maxDate = e.date;
    });
  });
  return maxDate;
}

function generateCoachNotes(){
  const lastDate = getLastSessionDate();
  if(!lastDate) return null;

  const items = [];
  Object.entries(data).forEach(([name, ex]) => {
    if(ex.trackBy === "checklist") return;
    for(let i = ex.entries.length - 1; i >= 0; i--){
      if(ex.entries[i].date === lastDate){
        const entry = ex.entries[i];
        const prev = ex.entries[i-1] || null;
        let trend = "first";
        if(prev){
          if(ex.trackBy === "weight") trend = entry.weight > prev.weight ? "increased" : entry.weight < prev.weight ? "decreased" : "held";
          else trend = entry.reps > prev.reps ? "increased" : entry.reps < prev.reps ? "decreased" : "held";
        }
        const targetReps = ex.targetReps || 8;
        const hit = ex.trackBy === "weight" ? entry.reps >= targetReps : true;
        items.push({ name, entry, trend, hit, ex });
        break;
      }
    }
  });
  if(!items.length) return null;

  // Guess which day type this session matches best, just for the opening line
  const dayGuess = guessDayForNames(items.map(i => i.name));
  const dayLabel = dayGuess ? DAY_TITLES[dayGuess] : "Last session";

  const total = items.length;
  const hitCount = items.filter(i => i.hit).length;
  const increased = items.filter(i => i.trend === "increased");
  const missed = items.filter(i => !i.hit);
  const concerns = items.filter(i => i.entry.note && CONCERN_WORDS.some(w => i.entry.note.toLowerCase().includes(w)));

  const sentences = [];
  sentences.push(`${dayLabel} on ${fmtDate(lastDate)} - ${hitCount}/${total} lifts hit target clean.`);

  if(increased.length){
    const names = increased.slice(0,2).map(i => i.name).join(" and ");
    sentences.push(`${names} moved up in weight and still landed it - good sign, keep building there.`);
  }
  if(missed.length){
    const names = missed.slice(0,2).map(i => i.ex.trackBy==="weight" ? `${i.name} (${i.entry.weight}lbs)` : i.name).join(" and ");
    sentences.push(`${names} missed target - hold steady there next time instead of adding more.`);
  }
  if(concerns.length){
    const c = concerns[0];
    sentences.push(`Worth flagging: ${c.name} noted "${escapeHtml(c.entry.note)}" - keep an eye on that rather than pushing through it.`);
  }
  if(!missed.length && !concerns.length && hitCount === total){
    sentences.push(increased.length ? `Clean session across the board - nothing to dial back here.` : `Solid and consistent - everything landed, nothing urgent to change.`);
  }
  if(skiSeasonMode && (dayGuess === "lower" || dayGuess === "full")){
    sentences.push(`🎿 Ski season is on - keep leaning into single-leg work and a controlled lowering phase on squat/split squat/lunge.`);
  }
  if(kneeCareMode){
    sentences.push(`🦵 Knee care mode is on - squat, Bulgarian split squat, and walking lunge are holding at a lighter load.`);
  }
  if(lowBackCareMode){
    sentences.push(`🩺 Low back care mode is on - squat, RDL, barbell row, and kettlebell swings are holding at a lighter load.`);
  }

  return sentences.join(" ");
}

function renderLastSessionBreakdown(){
  const lastDate = getLastSessionDate();
  if(!lastDate) return "";
  const sessionsByDate = getSessionsByDate();
  const names = sessionsByDate[lastDate];
  if(!names || !names.length) return "";

  let html = `<div onclick="toggleLastSessionExpanded()" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:0.78rem;color:var(--slate);margin-top:0.6rem;padding-top:0.5rem;border-top:1px dashed var(--line);">
    <span>${names.length} exercise${names.length===1?'':'s'} logged</span>
    <span style="color:var(--amber);font-weight:600;">${lastSessionExpanded ? 'Hide breakdown ▲' : 'Show breakdown ▼'}</span>
  </div>`;

  if(lastSessionExpanded){
    html += `<div style="margin-top:0.5rem;">`;
    names.forEach(n => {
      const ex = data[n];
      const entry = ex.entries.slice().reverse().find(e => e.date === lastDate);
      if(entry){
        html += `<div class="session-row">
          <span>${n}</span>
          <span class="exact">${formatEntryValue(entry, ex)}</span>
          <span class="exact">${entry.difficulty ?? "-"}</span>
        </div>`;
      }
    });
    html += `</div>`;
  }

  return html;
}

function renderOverview(){
  const app = document.getElementById("app");
  const overviewData = Object.entries(data).map(([name, ex]) => {
    if(ex.entries.length < 2) return null;
    const f = ex.entries[0], l = ex.entries[ex.entries.length-1];
    const firstVal = ex.trackBy==="weight" ? f.weight : f.reps;
    const lastVal = ex.trackBy==="weight" ? l.weight : l.reps;
    if(!firstVal) return null;
    const pct = ((lastVal-firstVal)/firstVal)*100;
    return { name, pct, firstVal, lastVal, trackBy: ex.trackBy };
  }).filter(Boolean).sort((a,b) => b.pct - a.pct);

  const avgPct = overviewData.length ? overviewData.reduce((s,o)=>s+o.pct,0)/overviewData.length : 0;
  const totalSessions = Object.values(data).reduce((s,ex)=>s+ex.entries.length,0);
  const progressing = overviewData.filter(o=>o.pct>0).length;
  const holding = overviewData.filter(o=>o.pct===0).length;
  const declining = overviewData.filter(o=>o.pct<0).length;

  const dayAgg = ["full","upper","lower"].map(day => {
    const names = DAY_ORDER[day];
    const relevant = overviewData.filter(o => names.includes(o.name));
    const avg = relevant.length ? relevant.reduce((s,o)=>s+o.pct,0)/relevant.length : null;
    return { day, title: DAY_TITLES[day], avg, count: relevant.length, total: names.length };
  });

  const coachNotes = generateCoachNotes();

  let html = "";
  if(coachNotes){
    html += `<div class="card" style="border-color:var(--amber-light);background:var(--rec-bg);">
      <h3 class="section" style="color:var(--amber);">🎯 Coach's Notes</h3>
      <p style="font-size:0.85rem;line-height:1.5;color:var(--ink);margin:0;">${coachNotes}</p>
      ${renderLastSessionBreakdown()}
    </div>`;
  }

  html += renderCalendar();

  html += `<div class="card">
    <h3 class="section">Aggregate Progress</h3>
    <div class="ov-grid">
      <div><div class="n" style="color:var(--emerald)">${avgPct>0?'+':''}${avgPct.toFixed(0)}%</div><div class="l">avg change</div></div>
      <div><div class="n">${totalSessions}</div><div class="l">sets logged</div></div>
      <div><div class="n">${overviewData.length}</div><div class="l">lifts tracked</div></div>
    </div>
    <div style="display:flex;gap:0.6rem;font-size:0.72rem;margin-bottom:0.8rem;">
      <span style="color:var(--emerald);font-weight:600;">▲ ${progressing} progressing</span>
      <span style="color:var(--slate);font-weight:600;">● ${holding} holding</span>
      <span style="color:var(--amber);font-weight:600;">▼ ${declining} below first logged</span>
    </div>
    <div style="border-top:1px dashed var(--line);padding-top:0.7rem;">
      <h3 class="section">Net Change by Day</h3>
      <div class="ov-grid">`;
  dayAgg.forEach(d => {
    const color = d.avg===null ? "var(--slate)" : d.avg>0 ? "var(--emerald)" : d.avg<0 ? "var(--amber)" : "var(--slate)";
    html += `<div><div class="n" style="color:${color}">${d.avg===null?'-':(d.avg>0?'+':'')+d.avg.toFixed(0)+'%'}</div><div class="l">${d.title}</div><div style="font-size:0.62rem;color:var(--slate);">${d.count}/${d.total} lifts w/ data</div></div>`;
  });
  html += `</div></div></div>`;

  html += `<div class="card">`;
  html += `<div onclick="toggleVolumeExpanded()" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
    <h3 class="section" style="margin:0;">Volume Trends by Day</h3>
    <span style="font-size:0.78rem;color:var(--amber);font-weight:600;">${volumeExpanded ? 'Hide ▲' : 'Show ▼'}</span>
  </div>`;
  if(!volumeExpanded){
    html += `<div style="margin-top:0.5rem;">`;
    ["full","upper","lower"].forEach(day => {
      const history = calcDayVolumeHistory(day);
      const latest = history.length ? history[history.length-1].weight : null;
      const prev = history.length > 1 ? history[history.length-2].weight : null;
      const pct = (latest !== null && prev) ? ((latest - prev) / prev) * 100 : null;
      const pctColor = pct === null ? "var(--slate)" : pct > 0 ? "var(--emerald)" : pct < 0 ? "var(--amber)" : "var(--slate)";
      const pctText = pct === null ? "-" : `${pct>0?'+':''}${pct.toFixed(0)}%`;
      html += `<div class="session-row">
        <span>${DAY_TITLES[day]}</span>
        <span class="exact">${latest !== null ? latest.toLocaleString()+" lbs" : "-"}</span>
        <span class="exact" style="color:${pctColor};">${pctText}</span>
      </div>`;
    });
    html += `</div>`;
  } else {
    ["full","upper","lower"].forEach(day => {
      const history = calcDayVolumeHistory(day);
      html += `<div style="margin-top:0.9rem;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <span style="font-weight:600;font-size:0.85rem;">${DAY_TITLES[day]}</span>
          ${history.length ? `<span style="font-family:var(--font-mono);font-size:0.76rem;color:var(--slate);">${history[history.length-1].weight.toLocaleString()} lbs last session</span>` : ''}
        </div>`;
      if(history.length){
        html += renderChart({ trackBy:"weight", entries: history }, null, false, "volume:" + day);
      } else {
        html += `<p style="font-size:0.78rem;color:var(--slate);font-style:italic;margin:0.3rem 0 0;">No sessions logged yet.</p>`;
      }
      html += `</div>`;
    });
  }
  html += `</div>`;

  html += `<div class="card"><h3 class="section">% Change Since First Logged</h3>`;
  if(!overviewData.length){
    html += `<p style="font-size:0.85rem;color:var(--slate);font-style:italic;">Need at least 2 sessions on a lift to show change.</p>`;
  } else {
    overviewData.forEach(o => {
      const color = o.pct>0 ? "var(--emerald)" : o.pct<0 ? "var(--amber)" : "var(--slate)";
      const width = Math.min(Math.abs(o.pct),100);
      const freq = frequencyLabel(data[o.name]);
      html += `<div class="bar-row">
        <div class="top"><span style="font-weight:500;">${o.name}</span><span style="font-family:var(--font-mono);font-size:0.72rem;color:${color};">${o.pct>0?'+':''}${o.pct.toFixed(0)}% · ${o.firstVal}→${o.lastVal}${o.trackBy==='weight'?'lbs':' reps'}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${width}%;background:${color};"></div></div>
        ${freq ? `<div style="font-size:0.66rem;color:var(--slate);margin-top:0.15rem;">${freq}</div>` : ''}
      </div>`;
    });
  }
  html += `</div>`;

  html += `<div class="card">
    <h3 class="section">Training Modifiers</h3>
    <div style="padding-bottom:0.7rem;margin-bottom:0.7rem;border-bottom:1px dashed var(--line);">
      <p style="font-size:0.78rem;color:var(--slate);margin:0 0 0.5rem;">
        🎿 Squat, Bulgarian Split Squat, and Walking Lunge shift to lower rep targets with a slower eccentric tempo and more single-leg emphasis. Roughly Nov-March.
      </p>
      <button class="tool-btn" onclick="toggleSkiSeason()" style="background:${skiSeasonMode ? 'var(--ski)' : ''};color:${skiSeasonMode ? '#fff' : ''};border-color:${skiSeasonMode ? 'var(--ski)' : ''};">
        ${skiSeasonMode ? '🎿 Ski Season: ON' : '🎿 Ski Season: OFF'}
      </button>
    </div>
    <div style="padding-bottom:0.7rem;margin-bottom:0.7rem;border-bottom:1px dashed var(--line);">
      <p style="font-size:0.78rem;color:var(--slate);margin:0 0 0.5rem;">
        🏔️ Adds power/explosive, frontal plane, eccentric quad, and loaded calf accessories to your existing Full/Upper/Lower days for the ~7-10 week ramp into ski season. Independent of Ski Season mode above - run either or both. Power work goes first in the session, after warmup and before the heavy lifts; stop a power set the moment speed drops, it's not conditioning. Leave 48+ hours between a 1,000+ ft MTB climb and a Full Body or Lower Body day, and skip power work entirely the day after a big climb.
      </p>
      <button class="tool-btn" onclick="togglePreseasonMode()" style="background:${preseasonMode ? 'var(--preseason)' : ''};color:${preseasonMode ? '#fff' : ''};border-color:${preseasonMode ? 'var(--preseason)' : ''};">
        ${preseasonMode ? '🏔️ Preseason Prep: ON' : '🏔️ Preseason Prep: OFF'}
      </button>
    </div>
    <div style="padding-bottom:0.7rem;margin-bottom:0.7rem;border-bottom:1px dashed var(--line);">
      <p style="font-size:0.78rem;color:var(--slate);margin:0 0 0.5rem;">
        🦵 Squat, Bulgarian Split Squat, and Walking Lunge hold and cut load ~10% while your knee settles down. Everything else trains as normal.
      </p>
      <button class="tool-btn" onclick="toggleKneeCareMode()" style="background:${kneeCareMode ? 'var(--knee)' : ''};color:${kneeCareMode ? '#fff' : ''};border-color:${kneeCareMode ? 'var(--knee)' : ''};">
        ${kneeCareMode ? '🦵 Knee Care: ON' : '🦵 Knee Care: OFF'}
      </button>
    </div>
    <div>
      <p style="font-size:0.78rem;color:var(--slate);margin:0 0 0.5rem;">
        🩺 Squat, RDL, Barbell Row, and Kettlebell Swings hold and cut load ~10% while your lower back settles down. Everything else trains as normal.
      </p>
      <button class="tool-btn" onclick="toggleLowBackCareMode()" style="background:${lowBackCareMode ? 'var(--back)' : ''};color:${lowBackCareMode ? '#fff' : ''};border-color:${lowBackCareMode ? 'var(--back)' : ''};">
        ${lowBackCareMode ? '🩺 Low Back Care: ON' : '🩺 Low Back Care: OFF'}
      </button>
    </div>
    <p style="font-size:0.64rem;color:var(--slate);margin:0.7rem 0 0;font-style:italic;">Knee and Low Back Care adjust training load only - not a substitute for a PT or doctor's evaluation.</p>
  </div>`;

  html += renderBackupSyncCard();

  html += `<p class="save-note">${APP_VERSION} · Last updated ${APP_UPDATED}</p>`;

  app.innerHTML = html;
}

function renderBackupSyncCard(){
  const pending = pendingQueue.length;
  let html = `<div class="card"><h3 class="section">Backup &amp; Restore</h3>`;

  if(currentSession){
    const syncedLabel = fmtSyncTime(lastSyncedAt);
    html += `<p style="font-size:0.72rem;color:var(--slate);margin:0 0 0.2rem;">☁ ${escapeHtml(currentSession.user.email)} · ${pending ? pending + " pending" : "synced"}</p>`;
    html += `<p style="font-size:0.64rem;color:var(--slate);margin:0 0 0.5rem;">Last synced: ${syncedLabel || "never yet"}</p>`;
    html += `<div class="header-tools" style="margin-bottom:0.6rem;">
      <button class="tool-btn" id="sync-now-btn" onclick="manualSync()">↻ Sync now</button>
      <button class="tool-btn" onclick="signOutUser()">Sign out</button>
    </div>`;
  } else {
    html += `<p style="font-size:0.7rem;color:var(--slate);margin:0 0 0.4rem;">Sign in to back up to the cloud (optional - logging works without it).</p>`;
    html += `<div class="form-row" style="margin-top:0;">
      <div class="field"><input type="email" id="auth-email" placeholder="Email"></div>
      <div class="field"><input type="password" id="auth-password" placeholder="Password"></div>
    </div>
    <div class="header-tools" style="margin-bottom:0.6rem;">
      <button class="tool-btn" onclick="handleSignIn()">Sign In</button>
      <button class="tool-btn" onclick="handleSignUp()">Create Account</button>
    </div>`;
  }

  html += `<div class="header-tools" style="padding-top:0.5rem;border-top:1px dashed var(--line);">
    <button class="tool-btn" onclick="backupData()">⬇ Backup data</button>
    <button class="tool-btn" onclick="document.getElementById('restore-input').click()">⬆ Restore backup</button>
    <input type="file" id="restore-input" accept="application/json" style="display:none" onchange="restoreData(event)">
  </div>`;
  html += `<p id="card-status" style="font-size:0.68rem;color:var(--slate);margin-top:0.5rem;"></p>`;

  html += `<div style="border-top:1px dashed var(--line);padding-top:0.7rem;margin-top:0.7rem;">
    <h3 class="section">Appearance</h3>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:0.7rem;">
      <div>
        <div style="font-size:0.85rem;font-weight:600;">Neon Dark Mode</div>
        <div style="font-size:0.68rem;color:var(--slate);margin-top:0.1rem;">80s high-contrast theme, everywhere in the app.</div>
      </div>
      <button class="theme-toggle${darkMode ? ' on' : ''}" onclick="toggleDarkMode()" aria-label="Toggle dark mode" aria-pressed="${darkMode}"><span class="knob"></span></button>
    </div>
  </div>`;

  html += `</div>`;
  return html;
}

// ---------- interactions ----------
function selectExercise(name){
  selected = name;
  render();
}
function toggleHistory(name){ openHistory[name] = !openHistory[name]; render(); }
function toggleAddExercise(){
  const row = document.getElementById("add-ex-row");
  row.style.display = row.style.display === "none" ? "flex" : "none";
}
function addExercise(){
  const input = document.getElementById("new-ex-name");
  const name = input.value.trim();
  if(!name || data[name]) return;
  data[name] = Object.assign(newExerciseShell(name), { day: view });
  selected = name;
  persist();
  enqueueOp({ id: genId(), type: "upsert_exercise", payload: { name } });
  render();
}
function cssId(name){ return name.replace(/[^a-z0-9]/gi,"-"); }
function escapeHtml(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function logEntry(){
  const ex = data[selected];
  const dateEl = document.getElementById("f-date");
  const noteEl = document.getElementById("f-note");
  const difficultyEl = document.getElementById("f-difficulty");
  const difficulty = difficultyEl && difficultyEl.value ? Math.max(1, Math.min(10, Number(difficultyEl.value))) : null;

  let entry;
  if(ex.trackBy === "duration"){
    const minutesEl = document.getElementById("f-minutes");
    if(!minutesEl || !minutesEl.value) return;
    entry = {
      clientId: genId(),
      label: "S" + (ex.entries.length + 1),
      date: dateEl.value || todayISO(),
      confirmed: true,
      minutes: Number(minutesEl.value),
      difficulty,
      note: (noteEl.value || "").trim(),
    };
    if(ex.trackDistance){
      const distEl = document.getElementById("f-distance");
      if(distEl && distEl.value) entry.distance = Number(distEl.value);
    }
    if(ex.trackSpeed){
      const speedEl = document.getElementById("f-speed");
      if(speedEl && speedEl.value) entry.speed = Number(speedEl.value);
    }
    if(ex.trackIncline){
      const inclineEl = document.getElementById("f-incline");
      if(inclineEl && inclineEl.value) entry.incline = Number(inclineEl.value);
    }
  } else {
    const isBodyweight = ex.trackBy === "reps";
    const weightEl = document.getElementById("f-weight");
    const setsEl = document.getElementById("f-sets");
    const repsEl = document.getElementById("f-reps");

    const sets = Number(setsEl.value) || 3;
    const reps = Number(repsEl.value) || effectiveTargetReps(ex);
    const weight = isBodyweight ? 0 : Number(weightEl.value);

    if(!isBodyweight && !weightEl.value) return;

    entry = {
      clientId: genId(),
      label: "S" + (ex.entries.length + 1),
      date: dateEl.value || todayISO(),
      confirmed: true,
      weight, sets, reps,
      difficulty,
      note: (noteEl.value || "").trim(),
    };
  }
  ex.entries.push(entry);
  persist();
  enqueueOp({ id: genId(), type: "upsert_entry", payload: { exerciseName: selected, clientId: entry.clientId } });
  checkCoreWorkoutComplete(view);
  render();

  const btn = document.querySelector(".log");
  if(btn){
    const originalText = btn.textContent;
    btn.classList.add("log-confirmed");
    btn.textContent = "Logged ✓";
    setTimeout(() => {
      btn.classList.remove("log-confirmed");
      btn.textContent = originalText;
    }, 1600);
  }
}

render();
</script>

</html>
