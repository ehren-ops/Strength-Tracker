<!DOCTYPE html>
<html lang="en">
<head>

<title>Strength Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --pine:#1F2B22; --pine-2:#2A3B2C; --stone:#F1EFE7; --card:#FBFAF6;
    --amber:#C97A2B; --amber-light:#E3A45F; --slate:#5B675C; --ink:#1B211C; --line:#DEDACB;
    --emerald:#0F6B4A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--stone);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);}
  header{background:linear-gradient(180deg,var(--pine) 0%,var(--pine-2) 100%);color:var(--stone);padding:calc(1.4rem + env(safe-area-inset-top)) 1.1rem 1.1rem;}
  header h1{font-family:'Fjalla One',sans-serif;font-weight:400;letter-spacing:0.03em;font-size:1.7rem;margin:0 0 0.2rem;text-transform:uppercase;}
  header p{margin:0;color:#C9D4C6;font-size:0.85rem;}
  .tabs{display:flex;gap:0.35rem;margin-top:0.9rem;flex-wrap:wrap;}
  .tab{flex:1;min-width:64px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0.5rem 0.3rem;border-radius:7px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);color:#C9D4C6;font-size:0.74rem;font-weight:600;cursor:pointer;}
  .tab.active{background:var(--amber);border-color:var(--amber);color:#1B211C;}
  .header-tools{display:flex;gap:0.4rem;margin-top:0.7rem;}
  .tool-btn{background:#FFFFFF;border:1px solid var(--line);color:var(--slate);font-size:0.72rem;font-weight:600;padding:0.4rem 0.7rem;border-radius:7px;cursor:pointer;}
  main{max-width:640px;margin:0 auto;padding:1rem 1rem 3rem;}
  .day-banner{background:#FFFFFF !important;border:2px solid var(--pine) !important;border-radius:8px;padding:0.55rem 0.75rem;margin-bottom:0.8rem;font-size:0.76rem;color:var(--pine) !important;font-weight:600;}
  .pill-row{display:flex;gap:0.35rem;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:0.7rem;padding-bottom:0.15rem;}
  .pill{flex:0 0 auto;font-size:0.7rem;padding:0.35rem 0.6rem;border-radius:7px;font-weight:500;cursor:pointer;background:#fff;border:1px solid var(--line);color:var(--slate);white-space:nowrap;}
  .pill-add{font-weight:700;padding:0.35rem 0.65rem;color:var(--amber);border-color:var(--amber-light);}
  .pill.active{background:var(--amber);border-color:var(--amber);color:#fff;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:0.7rem;}
  .ex-name{font-family:'Fjalla One',sans-serif;font-size:1.1rem;text-transform:uppercase;color:var(--pine);margin:0 0 0.6rem;}
  .big-val{font-family:'IBM Plex Mono',monospace;font-size:1.7rem;font-weight:600;}
  .delta{font-family:'IBM Plex Mono',monospace;font-size:0.82rem;font-weight:600;}
  .delta-line{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;font-weight:600;margin-top:0.2rem;}
  .plate-line{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--slate);margin-top:0.15rem;}
  .weight-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.4rem 0.9rem;}
  .weight-main{display:flex;align-items:baseline;flex-wrap:wrap;gap:0.4rem;}
  .onerm-box{text-align:right;flex-shrink:0;cursor:pointer;}
  .onerm-label{display:block;font-size:0.58rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--slate);white-space:nowrap;}
  .onerm-val{font-family:'IBM Plex Mono',monospace;font-size:0.85rem;font-weight:700;color:var(--ink);white-space:nowrap;}
  .onerm-edit{display:flex;align-items:center;gap:0.25rem;}
  .onerm-edit input{width:58px;padding:0.2rem 0.35rem;border:1px solid var(--line);border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:0.85rem;}
  .rec-box{margin-top:0.7rem;background:#FBF1E1;border:1px solid var(--amber-light);border-radius:8px;padding:0.65rem 0.75rem;color:#5C3A0F;}
  .rec-headline{font-family:'IBM Plex Mono',monospace;font-size:0.85rem;font-weight:700;margin-bottom:0.3rem;color:#4A2E0A;white-space:nowrap;overflow-x:auto;}
  .rec-desc{font-size:0.76rem;line-height:1.35;max-width:100%;}

  .progression-btn{display:inline-block;background:#fff;border:1px solid var(--line);color:var(--slate);font-size:0.72rem;font-weight:600;padding:0.4rem 0.7rem;border-radius:7px;cursor:pointer;}
  .progression-btn:active{background:#F7F4EC;}
  .action-row{display:flex;gap:0.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:0.7rem;}
  svg.chart{width:100%;height:150px;display:block;margin-top:0.6rem;}
  .form-row{display:flex;gap:0.5rem;margin-top:0.6rem;flex-wrap:wrap;}
  .field{flex:1 1 60px;}
  .field label{display:block;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--slate);margin-bottom:0.2rem;}
  .field input{width:100%;padding:0.45rem 0.5rem;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:0.9rem;}
  .field input:focus{outline:2px solid var(--amber-light);border-color:var(--amber);}
  button.log{margin-top:0.7rem;width:100%;background:var(--pine);color:var(--stone);border:none;border-radius:7px;padding:0.6rem;font-weight:600;font-size:0.85rem;cursor:pointer;transition:background-color 0.4s ease;}

  .date-row{margin-top:0.6rem;display:flex;flex-direction:column;align-items:stretch;}
  .date-row label{display:block;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--slate);margin-bottom:0.2rem;}
  .date-row input{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;-webkit-appearance:none;appearance:none;padding:0.45rem 0.5rem;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:0.9rem;}
  input[type="date"]{display:block !important;width:100% !important;max-width:100% !important;min-width:0 !important;box-sizing:border-box !important;-webkit-appearance:none !important;appearance:none !important;}

  .hist-toggle{background:none;border:none;padding:0;margin-top:0.6rem;font-size:0.74rem;color:var(--amber);font-weight:600;text-decoration:underline;cursor:pointer;}
  .hist{display:none;margin-top:0.5rem;border-top:1px dashed var(--line);padding-top:0.5rem;}
  .hist.open{display:block;}
  .hist-row{display:grid;grid-template-columns:70px 100px 54px 1fr;column-gap:0.5rem;align-items:baseline;font-size:0.76rem;padding:0.22rem 0;font-family:'IBM Plex Mono',monospace;color:var(--slate);border-bottom:1px solid #F0EDE2;}
  .hist-session-label{font-size:0.62rem;color:var(--amber-light);}
  .hist-row:last-child{border-bottom:none;}
  .hist-row .exact{color:var(--ink);text-align:left;}
  .hist-row.header{font-family:'IBM Plex Sans',sans-serif;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--slate);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:0.3rem;}
  .hist-row.latest{background:#FBF1E1;border-radius:4px;padding-left:0.3rem;margin-left:-0.3rem;}
  .hist-row.latest .exact{font-weight:600;}
  .latest-tag{font-family:'IBM Plex Sans',sans-serif;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--amber);font-weight:700;}
  .note{font-size:0.68rem;color:var(--amber);font-style:italic;margin-left:0.4rem;}
  .est{color:var(--amber-light);}
  .add-ex-row{display:flex;gap:0.4rem;margin-bottom:0.8rem;}
  .add-ex-row input{flex:1;padding:0.4rem 0.5rem;border:1px solid var(--line);border-radius:6px;font-size:0.85rem;}
  .add-ex-row button{background:var(--pine);color:#fff;border:none;border-radius:6px;padding:0.4rem 0.8rem;font-size:0.8rem;}
  .ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;margin-bottom:0.8rem;text-align:center;}
  .ov-grid .n{font-family:'IBM Plex Mono',monospace;font-size:1.2rem;font-weight:600;}
  .ov-grid .l{font-size:0.68rem;color:var(--slate);}
  .bar-row{margin-bottom:0.55rem;}
  .bar-row .top{display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:0.2rem;}
  .bar-track{height:6px;background:#EFEBDF;border-radius:3px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;}
  .save-note{text-align:center;font-size:0.7rem;color:var(--slate);margin-top:1rem;}
  h3.section{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--slate);margin:0 0 0.6rem;}
  .row-actions{display:inline-flex;gap:0.3rem;margin-left:0.4rem;}
  .icon-btn{background:none;border:none;color:var(--slate);font-size:0.78rem;cursor:pointer;padding:0 0.15rem;}
  .icon-btn:hover{color:var(--amber);}
  .hist-edit-box{background:#F7F4EC;border:1px solid var(--line);border-radius:8px;padding:0.6rem;margin:0.3rem 0;}
  .edit-actions{display:flex;gap:0.4rem;margin-top:0.5rem;}
  .save-btn{background:var(--pine);color:#fff;border:none;border-radius:6px;padding:0.4rem 0.8rem;font-size:0.78rem;font-weight:600;cursor:pointer;}
  .cancel-btn{background:#fff;border:1px solid var(--line);color:var(--slate);border-radius:6px;padding:0.4rem 0.8rem;font-size:0.78rem;cursor:pointer;}
  .danger-btn{background:#B3261E;color:#fff;border:none;border-radius:6px;padding:0.3rem 0.6rem;font-size:0.76rem;font-weight:600;cursor:pointer;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-header div{text-align:center;font-size:0.6rem;color:var(--slate);font-weight:700;text-transform:uppercase;padding-bottom:0.3rem;}
  .cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;position:relative;}
  .cal-cell.empty{visibility:hidden;}
  .cal-cell.has-session{cursor:pointer;background:#F7F4EC;}
  .cal-cell.has-session:active{background:#F0EBDF;}
  .cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--pine);}
  .cal-cell.selected{box-shadow:inset 0 0 0 1.5px var(--amber);}
  .cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:0.66rem;color:var(--ink);}
  .cal-badge{display:inline-flex;align-items:center;justify-content:center;min-width:14px;height:14px;border-radius:4px;color:#fff;font-size:0.58rem;font-weight:700;text-align:center;margin-top:1px;padding:0 2px;}
  .cal-detail{margin-top:0.7rem;padding-top:0.55rem;border-top:1px dashed var(--line);}
  .session-row{display:grid;grid-template-columns:1fr 110px 34px;column-gap:0.5rem;align-items:baseline;font-size:0.78rem;padding:0.18rem 0;font-family:'IBM Plex Mono',monospace;color:var(--slate);}
  .session-row span:first-child{color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-weight:500;}
  .session-row .exact{color:var(--ink);}
  .cal-legend{display:flex;gap:0.7rem;margin-top:0.7rem;font-size:0.68rem;color:var(--slate);flex-wrap:wrap;align-items:center;}
  .cal-legend span{display:flex;align-items:center;gap:0.25rem;}
  .card.ski-mode{border-color:#1565C0;box-shadow:0 0 0 1px rgba(21,101,192,0.18);}
  .ski-badge{display:inline-block;background:#1565C0;color:#fff;font-size:0.6rem;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:0.5rem;vertical-align:middle;letter-spacing:0.02em;}
  .ski-tempo-line{font-size:0.76rem;color:#0D47A1;background:#E3F0FC;border:1px solid #BBD9F5;border-radius:8px;padding:0.45rem 0.65rem;margin:0.5rem 0 0.7rem;}
</style>

<body>
<header>
  <h1 id="page-title">Full Body</h1>
  <p id="page-sub">Tap a day, log your sets, watch progress build.</p>
  <div class="tabs" id="tabs"></div>
</header>
<main id="app"></main>

<script>
const STORAGE_KEY = "strength-tracker-v1";
const BAR_WEIGHT = 45;
const PLATE_SET = [45, 35, 25, 10, 5, 2.5];

const SEED = {
  // Intentionally empty — publish this version without personal data baked in.

};

const DAY_ORDER = {
  full: ["Squat","Bench Press","Incline DB Press","RDL","Bulgarian Split Squat","Barbell Row","Cable Chest Fly","Face Pulls","Back Extension"],
  upper: ["Bench Press","Incline DB Press","Cable Chest Fly","Barbell Row","Cable Lat Pulldown","Face Pulls","Bicep Curl","Tricep Pushdown","Back Extension"],
  lower: ["Squat","RDL","Bulgarian Split Squat","Kettlebell Swings","Walking Lunge","Standing Calf Raise"],
  extra: ["Farmer's Carry","Zone 2 Ride","Incline Treadmill Walk"],
};
const DAY_TITLES = { full:"Full Body", upper:"Upper Body", lower:"Lower Body", extra:"Extra / Off-Day" };
const TAB_ORDER = ["full","upper","lower","extra","overview"];

// ---------- state ----------
let data = loadSaved() || JSON.parse(JSON.stringify(SEED));
let view = "full";
let selected = DAY_ORDER.full[0];
let calendarYear = new Date().getFullYear();
let calendarMonth = new Date().getMonth();
let calendarSelectedDate = null;
let calendarExpanded = false;
let lastSessionExpanded = false;
let volumeExpanded = false;
let openHistory = {};
let editingKey = null;
let deletingKey = null;
let editing1RM = null;
const SKI_MODE_KEY = "strength-tracker-ski-mode";
let skiSeasonMode = (function(){
  try{ return window.localStorage.getItem(SKI_MODE_KEY) === "1"; }catch(e){ return false; }
})();

function toggleSkiSeason(){
  skiSeasonMode = !skiSeasonMode;
  try{ window.localStorage.setItem(SKI_MODE_KEY, skiSeasonMode ? "1" : "0"); }catch(e){}
  render();
}

function effectiveTargetReps(ex){
  return (skiSeasonMode && ex.targetRepsSki) ? ex.targetRepsSki : (ex.targetReps || 8);
}

function loadSaved(){
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function persist(){
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  }catch(e){ return false; }
}

function backupData(){
  const payload = { exportedAt: new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `strength-tracker-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const statusEl = document.getElementById("tool-status");
  if(statusEl) statusEl.textContent = "Backup downloaded — save it somewhere safe (Files, email, iCloud).";
}

function restoreData(event){
  const file = event.target.files[0];
  const statusEl = document.getElementById("tool-status");
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      const restored = parsed.data ? parsed.data : parsed; // support raw data or {exportedAt,data} wrapper
      if(typeof restored !== "object") throw new Error("bad shape");
      data = restored;
      persist();
      render();
      if(statusEl) statusEl.textContent = "Backup restored successfully.";
    }catch(err){
      if(statusEl) statusEl.textContent = "That file didn't look like a valid backup.";
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

// ---------- helpers ----------
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function daysBetween(dateStrA, dateStrB){
  // Compares two "YYYY-MM-DD" local calendar dates as pure integer day counts,
  // sidestepping local/UTC parsing mismatches entirely.
  const [ay,am,ad] = dateStrA.split("-").map(Number);
  const [by,bm,bd] = dateStrB.split("-").map(Number);
  return Math.round((Date.UTC(by,bm-1,bd) - Date.UTC(ay,am-1,ad)) / 86400000);
}

function calcPlates(totalWeight){
  const perSide = (totalWeight - BAR_WEIGHT) / 2;
  if(perSide <= 0) return { perSide:0, plates:[], unreachable:false };
  let remaining = Math.round(perSide*100)/100;
  const plates = [];
  for(const p of PLATE_SET){
    const count = Math.floor(remaining/p + 1e-9);
    if(count > 0){ plates.push({plate:p,count}); remaining = Math.round((remaining-count*p)*100)/100; }
  }
  return { perSide, plates, unreachable: remaining > 0.01 };
}
function platesLabel(totalWeight, equipment){
  if(equipment !== "barbell") return null;
  const { perSide, plates, unreachable } = calcPlates(totalWeight);
  if(perSide === 0) return `No plates needed`;
  const parts = plates.map(p => `${p.count}×${p.plate}`).join(" + ");
  return `${parts} per side${unreachable ? " — closest with standard plates" : ""}`;
}
function repLabel(sets, reps, unit){
  return unit === "sec" ? `${sets}x${reps}sec` : `${sets}x${reps}`;
}

function formatEntryValue(e, ex){
  if(ex.trackBy === "weight") return `${e.weight}lbs ${repLabel(e.sets, e.reps, ex.unit)}`;
  if(ex.trackBy === "duration") return `${e.minutes} min`;
  return repLabel(e.sets, e.reps, ex.unit);
}
function niceTicks(values, forceStep){
  const nums = values.filter(v => v !== null && v !== undefined);
  if(!nums.length) return { lo:0, hi:10, step:2 };
  const min = Math.min(...nums), max = Math.max(...nums);
  const range = max - min || 1;
  let step;
  if(forceStep){
    step = forceStep;
  } else if(range <= 100){
    // normal per-lift weight tracking: keep to the 2.5/5/10lb grain plates actually move in
    step = range <= 20 ? 2.5 : range <= 60 ? 5 : 10;
  } else {
    // larger-magnitude series (e.g. total session volume in the thousands):
    // pick a clean round step aiming for ~5 gridlines instead of a fixed lb grain
    const roughStep = range / 5;
    const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
    const norm = roughStep / magnitude;
    const niceNorm = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
    step = niceNorm * magnitude;
  }
  const lo = Math.floor(min/step)*step;
  const hi = Math.ceil(max/step)*step === lo ? lo + step : Math.ceil(max/step)*step;
  return { lo, hi, step };
}

function ticksBetween(lo, hi, step){
  const out = [];
  const safeStep = step > 0 ? step : 1;
  const maxTicks = 20; // defensive cap, should never actually be hit with niceTicks' logic
  for(let v = lo, i = 0; v <= hi + 1e-9 && i < maxTicks; v += safeStep, i++){
    out.push(Math.round(v * 100) / 100);
  }
  return out;
}

function estimate1RM(weight, reps){
  // Epley formula — rough estimate, not a substitute for an actual tested max
  return Math.round(weight * (1 + reps / 30));
}

function restTimeFor(ex){
  const tr = effectiveTargetReps(ex);
  if(tr <= 6) return "2.5–3 min";
  if(tr <= 10) return "90 sec";
  if(tr <= 15) return "60–75 sec";
  return "45–60 sec";
}

function calcVolume(entry, ex){
  return ex.trackBy === "weight" ? entry.weight * entry.sets * entry.reps : 0;
}

function calcDayVolumeHistory(day){
  const names = DAY_ORDER[day];
  const byDate = {};
  names.forEach(name => {
    const ex = data[name];
    if(!ex) return;
    ex.entries.forEach(e => {
      if(!e.date) return;
      byDate[e.date] = (byDate[e.date] || 0) + calcVolume(e, ex);
    });
  });
  return Object.keys(byDate).sort().map((date, i) => ({
    label: "S" + (i + 1), date, confirmed: true, weight: Math.round(byDate[date]), sets: 1, reps: 1, note: "",
  }));
}

function frequencyLabel(ex){
  if(ex.entries.length < 2) return null;
  const dates = ex.entries.map(e => new Date(e.date + "T00:00:00")).filter(d => !isNaN(d)).sort((a,b) => a-b);
  if(dates.length < 2) return null;
  let totalGap = 0;
  for(let i = 1; i < dates.length; i++) totalGap += (dates[i] - dates[i-1]) / 86400000;
  const avgGap = totalGap / (dates.length - 1);
  return `${ex.entries.length}x logged, ~every ${avgGap.toFixed(1)}d`;
}

function computeRecoveryReadiness(){
  const lastDate = getLastSessionDate();
  if(!lastDate) return null;
  const daysSince = Math.max(0, daysBetween(lastDate, todayISO()));

  // Average difficulty across the most recent few logged sets, across all exercises
  const allEntries = [];
  Object.values(data).forEach(ex => ex.entries.forEach(e => { if(e.difficulty) allEntries.push({ date: e.date, difficulty: e.difficulty }); }));
  allEntries.sort((a,b) => (a.date < b.date ? 1 : -1));
  const recentDiff = allEntries.slice(0, 5);
  const avgDifficulty = recentDiff.length ? recentDiff.reduce((s,e)=>s+e.difficulty,0)/recentDiff.length : null;

  // ~3 days rested reaches full readiness on its own; only a genuinely hard
  // recent stretch (avg difficulty above 7) pulls it back down, and only
  // modestly — this isn't meant to demand a week off for one tough session.
  let readiness = daysSince * 3.5;
  if(avgDifficulty !== null && avgDifficulty > 7) readiness -= (avgDifficulty - 7) * 0.8;
  readiness = Math.max(0, Math.min(10, Math.round(readiness)));

  const neededRestDays = Math.min(3, Math.max(0, Math.ceil((6 - readiness) / 3.5)));
  return { readiness, daysSince, avgDifficulty, neededRestDays, lastDate };
}


function computeSuggestion(ex){
  if(!ex.entries.length) return null;
  const last = ex.entries[ex.entries.length-1];
  const targetReps = effectiveTargetReps(ex);
  const increment = ex.increment || 5;

  if(ex.trackBy === "weight"){
    // Streak of same-weight sessions (for progression), most recent first
    let streak = 0, allHit = true;
    for(let i = ex.entries.length - 1; i >= 0; i--){
      if(ex.entries[i].weight === last.weight){
        streak++;
        if(ex.entries[i].reps < targetReps) allHit = false;
      } else break;
    }

    // Separately: how many *consecutive* misses at this same weight, most
    // recent first — stops at the first hit or the first different weight.
    let missStreak = 0;
    for(let i = ex.entries.length - 1; i >= 0; i--){
      const e = ex.entries[i];
      if(e.weight === last.weight && e.reps < targetReps) missStreak++;
      else break;
    }

    // Deload check takes priority over everything else: 3+ straight misses
    // at the same weight means grinding harder isn't working — drop the load.
    if(missStreak >= 3){
      const deloadWeight = Math.round((last.weight * 0.85) / 2.5) * 2.5;
      return {
        weight: deloadWeight,
        sets: last.sets,
        reps: targetReps,
        hitTarget: false,
        readyToProgress: false,
        streak, requiredStreak: ex.conservative ? 2 : 1,
        difficultyNote: null,
        deload: true,
        missStreak,
      };
    }

    const requiredStreak = ex.conservative ? 2 : 1;
    const hitTarget = last.reps >= targetReps;
    let readyToProgress = streak >= requiredStreak && allHit;
    let difficultyNote = null;

    if(last.difficulty){
      if(last.difficulty >= 9 && readyToProgress){
        readyToProgress = false;
        difficultyNote = "hard";
      } else if(last.difficulty <= 4 && hitTarget && !readyToProgress){
        readyToProgress = true;
        difficultyNote = "easy";
      }
    }

    return {
      weight: readyToProgress ? last.weight + increment : last.weight,
      sets: last.sets,
      reps: targetReps,
      hitTarget,
      readyToProgress,
      streak,
      requiredStreak,
      difficultyNote,
      deload: false,
    };
  }

  if(ex.trackBy === "duration"){
    let minutes = last.minutes;
    let note = "hold";
    if(last.difficulty){
      if(last.difficulty <= 5){ minutes = last.minutes + 5; note = "easy"; }
      else if(last.difficulty >= 8){ minutes = Math.max(10, last.minutes - 5); note = "hard"; }
    }
    return { minutes, difficultyNote: note };
  }

  return { reps: last.reps + 2, sets: last.sets, hitTarget: true };
}

function allDayNames(){
  return Object.keys(DAY_ORDER).flatMap(k => DAY_ORDER[k]);
}

// ---------- rendering ----------
function render(){
  renderTabs();
  if(view === "overview") renderOverview();
  else renderDay(view);
}

function renderTabs(){
  document.getElementById("tabs").innerHTML = TAB_ORDER.map(v =>
    `<div class="tab ${view===v?'active':''}" onclick="switchView('${v}')">${v==='overview'?'Overview':DAY_TITLES[v]}</div>`
  ).join("");
  document.getElementById("page-title").textContent = view === "overview" ? "Overview" : DAY_TITLES[view];
  document.getElementById("page-sub").textContent = view === "overview"
    ? "Aggregate progress across everything you've logged."
    : "Tap a day, log your sets, watch progress build.";
}

function switchView(v){
  view = v;
  if(v !== "overview" && DAY_ORDER[v] && DAY_ORDER[v].length) selected = DAY_ORDER[v][0];
  render();
}

function renderDay(day){
  const app = document.getElementById("app");
  const customExercises = Object.keys(data).filter(k => !allDayNames().includes(k) && (data[k].day || "full") === day);
  const list = DAY_ORDER[day].concat(customExercises);

  let html = `<div class="pill-row" id="pill-scroll">`;
  list.forEach((name, i) => {
    html += `<div class="pill ${selected===name?'active':''}" onclick="selectExercise('${name.replace(/'/g,"\\'")}')">${(day !== "extra" && i < DAY_ORDER[day].length) ? (i+1)+'. ' : ''}${name}</div>`;
  });
  html += `<div class="pill pill-add" onclick="toggleAddExercise()">+</div></div>`;
  html += `<div id="add-ex-row" style="display:none" class="add-ex-row">
    <input id="new-ex-name" placeholder="Exercise name">
    <button onclick="addExercise()">Add</button>
  </div>`;

  let ex = data[selected];
  if(!ex && DAY_ORDER[day].includes(selected)){
    ex = data[selected] = { trackBy:"weight", entries:[] };
    persist();
  }
  if(!ex){
    app.innerHTML = html + `<p style="color:var(--slate);font-size:0.85rem;">Select an exercise above.</p>`;
    return;
  }
  html += renderExerciseCard(selected, ex);
  app.innerHTML = html;
}

function render1RMInline(name, ex, last){
  if(editing1RM === name){
    return `<div class="onerm-box onerm-edit">
      <input type="number" inputmode="decimal" id="input-1rm" value="${ex.actual1RM || ''}">
      <button class="icon-btn" onclick="save1RM('${name.replace(/'/g,"\\'")}')">✓</button>
      <button class="icon-btn" onclick="cancel1RM()">✕</button>
    </div>`;
  }
  if(!ex.actual1RM && !last.weight){
    return `<div class="onerm-box" onclick="start1RM('${name.replace(/'/g,"\\'")}')">
      <span class="onerm-label">1RM</span>
      <span class="onerm-val">— ✎</span>
    </div>`;
  }
  const oneRM = ex.actual1RM || estimate1RM(last.weight, last.reps);
  const label = ex.actual1RM ? "1RM (actual)" : "Est. 1RM";
  return `<div class="onerm-box" onclick="start1RM('${name.replace(/'/g,"\\'")}')">
    <span class="onerm-label">${label}</span>
    <span class="onerm-val">${oneRM} lbs ✎</span>
  </div>`;
}

function renderProgressionToggle(name, ex){
  if(ex.trackBy !== "weight") return "";
  return `<button class="progression-btn" onclick="toggleConservative('${name.replace(/'/g,"\\'")}')">
    Progression: ${ex.conservative ? "Conservative" : "Standard"}
  </button>`;
}

function toggleConservative(name){
  data[name].conservative = !data[name].conservative;
  persist();
  render();
}

function start1RM(name){ editing1RM = name; render(); }
function cancel1RM(){ editing1RM = null; render(); }
function save1RM(name){
  const val = Number(document.getElementById("input-1rm").value);
  if(val > 0) data[name].actual1RM = val;
  else delete data[name].actual1RM;
  editing1RM = null;
  persist();
  render();
}

function renderExerciseCard(name, ex){
  const hasEntries = ex.entries.length > 0;
  const last = hasEntries ? ex.entries[ex.entries.length-1] : null;
  const first = hasEntries ? ex.entries[0] : null;
  const suggestion = computeSuggestion(ex);
  const skiActive = skiSeasonMode && !!ex.targetRepsSki;

  let html = `<div class="card${skiActive ? ' ski-mode' : ''}">`;
  html += `<h2 class="ex-name">${name}${skiActive ? '<span class="ski-badge">🎿 Ski</span>' : ''}</h2>`;
  if(skiActive && ex.skiTempo){
    html += `<div class="ski-tempo-line">Tempo: ${ex.skiTempo} — target reps shifted to ${ex.targetRepsSki} for ski season</div>`;
  }

  if(!hasEntries){
    html += `<p style="color:var(--slate);font-size:0.85rem;">No entries yet — log your first set below.</p>`;
  } else {
    const delta = ex.entries.length > 1
      ? (ex.trackBy==="weight" ? last.weight-first.weight : ex.trackBy==="duration" ? last.minutes-first.minutes : last.reps-first.reps)
      : 0;
    const deltaColor = delta>0 ? "color:var(--emerald)" : delta<0 ? "color:var(--amber)" : "color:var(--slate)";
    const bigVal = ex.trackBy==="weight" ? last.weight+" lbs" : ex.trackBy==="duration" ? last.minutes+" min" : last.reps+" reps";

    html += `<div class="weight-row">
      <div class="weight-main">
        <span class="big-val">${bigVal}</span>
      </div>
      ${ex.trackBy === "weight" ? render1RMInline(name, ex, last) : ''}
    </div>`;

    if(ex.entries.length>1){
      html += `<div class="delta-line" style="${deltaColor}">${delta>0?'+':''}${delta} since first</div>`;
    }

    let recHtml = "";
    if(suggestion){
      const unitWord = ex.unit === "sec" ? "hold time" : "reps";
      let msg;
      let nextLabel;
      if(ex.trackBy === "weight"){
        nextLabel = `${suggestion.weight} lbs ${repLabel(suggestion.sets,suggestion.reps,ex.unit)}`;
        if(suggestion.deload){
          msg = `Missed target ${unitWord} for ${suggestion.missStreak} sessions straight — that's a stall, not a bad day. Dropping ~15% to rebuild with clean reps.`;
        } else if(suggestion.difficultyNote === "hard"){
          msg = `Hit target ${unitWord}, but rated 9-10/10 — holding here until it feels more manageable.`;
        } else if(suggestion.difficultyNote === "easy"){
          msg = `Hit target ${unitWord} and rated it easy — fast-tracking the increase.`;
        } else if(suggestion.readyToProgress){
          msg = ex.conservative
            ? `Hit target ${unitWord} for ${suggestion.streak} sessions straight, progress it.`
            : `Hit target ${unitWord} last time, progress the weight.`;
        } else if(suggestion.hitTarget){
          msg = `Hit target ${unitWord}, but only ${suggestion.streak} session${suggestion.streak>1?'s':''} at this weight — hold one more before adding.`;
        } else {
          msg = `Missed target ${unitWord} last time, hold weight and chase it.`;
        }
      } else if(ex.trackBy === "duration"){
        nextLabel = `${suggestion.minutes} min`;
        msg = suggestion.difficultyNote === "easy"
          ? `Felt easy last time — adding 5 minutes.`
          : suggestion.difficultyNote === "hard"
          ? `Rated hard last time — pulling back 5 minutes to stay sustainable.`
          : `Held steady — log a difficulty rating next time for a sharper call.`;
      } else {
        nextLabel = repLabel(suggestion.sets,suggestion.reps,ex.unit);
        msg = `Bodyweight move, aiming for a couple more reps.`;
      }
      const restPart = ex.trackBy !== "duration" ? ` <span style="font-weight:400;">· Rest ${restTimeFor(ex)}</span>` : "";
      const diffText = last.difficulty ? last.difficulty + "/10" : "not rated";
      const loadLine = ex.equipment === "barbell" ? `<div class="plate-line" style="margin-top:0.4rem;">Load: ${platesLabel(suggestion.weight, ex.equipment)}</div>` : "";
      recHtml = `<div class="rec-box">
        <div class="rec-headline">Next: ${nextLabel}${restPart}</div>
        <div class="rec-desc">${msg} Last difficulty: <b>${diffText}</b></div>
        ${loadLine}
      </div>`;
    }

    html += recHtml;
    html += renderChart(ex, suggestion, true);
  }

  html += renderForm(name, ex);

  if(!hasEntries){
    html += `<div style="margin-top:0.7rem;"><p style="color:var(--slate);font-size:0.8rem;font-style:italic;">Nothing logged yet.</p></div>`;
  } else {
    // keep original array index attached so edit/delete target the right entry
    const reversed = ex.entries.map((e,i) => ({ e, i })).reverse(); // most recent first
    const recent = reversed.slice(0, 3);
    const older = reversed.slice(3);

    html += `<div style="margin-top:0.9rem;">`;
    html += `<h3 class="section" style="margin-bottom:0.4rem;">Recent History</h3>`;
    html += `<div class="hist-row header"><span>Date</span><span>${ex.trackBy==="weight"?"Weight/":""}${ex.unit==="sec"?"Sets/Sec":"Sets/Reps"}</span><span>Diff.</span><span>Note</span></div>`;
    recent.forEach((r, idx) => { html += renderHistRow(r.e, r.i, idx === 0, ex, name); });

    if(older.length){
      html += `<button class="hist-toggle" onclick="toggleHistory('${name.replace(/'/g,"\\'")}')">Show earlier history (${older.length})</button>`;
      html += `<div class="hist ${openHistory[name] ? 'open' : ''}" id="hist-${cssId(name)}">`;
      older.forEach(r => { html += renderHistRow(r.e, r.i, false, ex, name); });
      html += `</div>`;
    }

    if(ex.entries.some(e => e.confirmed===false)){
      html += `<p style="font-size:0.68rem;color:var(--slate);margin-top:0.4rem;">* estimated date, not confirmed</p>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function renderHistRow(e, idx, isLatest, ex, name){
  const key = name + "|" + idx;

  if(editingKey === key){
    const unitLabel = ex.unit === "sec" ? "Seconds" : "Reps";
    return `<div class="hist-edit-box">
      <div class="form-row">
        ${ex.trackBy==="weight" ? `<div class="field"><label>Weight</label><input type="number" inputmode="decimal" id="edit-weight" value="${e.weight}"></div>` : ""}
        ${ex.trackBy==="duration"
          ? `<div class="field" style="flex:1 1 100%;"><label>Minutes</label><input type="number" inputmode="numeric" id="edit-minutes" value="${e.minutes}"></div>`
          : `<div class="field"><label>Sets</label><input type="number" inputmode="numeric" id="edit-sets" value="${e.sets}"></div>
             <div class="field"><label>${unitLabel}</label><input type="number" inputmode="numeric" id="edit-reps" value="${e.reps}"></div>`
        }
      </div>
      <div class="form-row">
        <div class="field" style="flex:1 1 100%;"><label>Date</label><input type="date" id="edit-date" value="${e.date || todayISO()}"></div>
      </div>
      <div class="form-row">
        <div class="field" style="flex:1 1 100%;"><label>Note</label><input type="text" id="edit-note" value="${e.note ? escapeHtml(e.note) : ''}"></div>
      </div>
      <div class="edit-actions">
        <button class="save-btn" onclick="saveEditEntry('${name.replace(/'/g,"\\'")}', ${idx})">Save</button>
        <button class="cancel-btn" onclick="cancelEdit()">Cancel</button>
      </div>
    </div>`;
  }

  if(deletingKey === key){
    return `<div class="hist-row${isLatest?' latest':''}" style="grid-template-columns:1fr auto auto;">
      <span style="color:var(--slate);">Delete this entry?</span>
      <button class="danger-btn" onclick="confirmDeleteEntry('${name.replace(/'/g,"\\'")}', ${idx})">Yes, delete</button>
      <button class="cancel-btn" onclick="cancelDelete()">Cancel</button>
    </div>`;
  }

  let html = `<div class="hist-row${isLatest?' latest':''}">`;
  const todayTag = (isLatest && e.date === todayISO()) ? ' (TODAY)' : '';
  html += `<span>${fmtDate(e.date)}${e.confirmed===false?'<span class="est">*</span>':''}${isLatest?` <span class="latest-tag">Latest${todayTag}</span>`:''}<br><span class="hist-session-label">${e.label}</span></span>`;
  html += `<span class="exact">${formatEntryValue(e, ex)}</span>`;
  html += `<span class="exact">${e.difficulty ?? "—"}</span>`;
  html += `<span>`;
  if(e.note) html += `<span class="note">${escapeHtml(e.note)}</span>`;
  html += `<span class="row-actions">
    <button class="icon-btn" onclick="startEdit('${name.replace(/'/g,"\\'")}', ${idx})" aria-label="Edit">✎</button>
    <button class="icon-btn" onclick="startDelete('${name.replace(/'/g,"\\'")}', ${idx})" aria-label="Delete">✕</button>
  </span>`;
  html += `</span>`;
  html += `</div>`;
  return html;
}

function startEdit(name, idx){ editingKey = name + "|" + idx; deletingKey = null; render(); }
function cancelEdit(){ editingKey = null; render(); }
function startDelete(name, idx){ deletingKey = name + "|" + idx; editingKey = null; render(); }
function cancelDelete(){ deletingKey = null; render(); }

function saveEditEntry(name, idx){
  const ex = data[name];
  const entry = ex.entries[idx];
  const dateVal = document.getElementById("edit-date").value || entry.date;
  const noteVal = document.getElementById("edit-note").value || "";
  entry.date = dateVal;
  entry.note = noteVal.trim();

  if(ex.trackBy === "duration"){
    const minutesEl = document.getElementById("edit-minutes");
    if(minutesEl) entry.minutes = Number(minutesEl.value) || entry.minutes;
  } else {
    const isBodyweight = ex.trackBy === "reps";
    const weightEl = document.getElementById("edit-weight");
    entry.sets = Number(document.getElementById("edit-sets").value) || entry.sets;
    entry.reps = Number(document.getElementById("edit-reps").value) || entry.reps;
    if(!isBodyweight && weightEl) entry.weight = Number(weightEl.value) || entry.weight;
  }

  // Keep entries sorted by date in case the edited date moved it
  ex.entries.sort((a,b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))
    .forEach((e,i) => { e.label = "S" + (i+1); });

  editingKey = null;
  persist();
  render();
}

function confirmDeleteEntry(name, idx){
  const ex = data[name];
  ex.entries.splice(idx, 1);
  ex.entries.forEach((e,i) => { e.label = "S" + (i+1); });
  deletingKey = null;
  persist();
  render();
}

  if(ex.entries.length){
    html += `<div class="action-row">`;

    html += renderProgressionToggle(name, ex);

  }

    html += `<div class="field"><label>Weight</label><input type="number" inputmode="decimal" id="f-weight"></div>`;
    html += `<div class="field"><label>Sets</label><input type="number" inputmode="numeric" id="f-sets" value="3"></div>`;
    html += `<div class="field"><label>${unitLabel}</label><input type="number" inputmode="numeric" id="f-reps" value="${effectiveTargetReps(ex)}"></div>`;
  } else if(ex.trackBy === "duration"){
    html += `<div class="field" style="flex:1 1 100%;"><label>Minutes</label><input type="number" inputmode="numeric" id="f-minutes"></div>`;
  } else {
    html += `<div class="field"><label>Sets</label><input type="number" inputmode="numeric" id="f-sets" value="3"></div>`;
    html += `<div class="field"><label>${unitLabel}</label><input type="number" inputmode="numeric" id="f-reps" value="${effectiveTargetReps(ex)}"></div>`;
  }
  html += `</div>`;
  html += `<div class="form-row">
    <div class="field" style="flex:0 0 68px;"><label>Difficulty</label><input type="number" inputmode="numeric" id="f-difficulty" min="1" max="10" value="7"></div>
    <div class="field" style="flex:1 1 140px;"><label>Note</label><input type="text" id="f-note" placeholder="${ex.trackBy==='duration' ? 'e.g. easy spin' : 'e.g. felt heavy'}"></div>
  </div>`;
  html += `<div class="date-row">
    <label>Date</label>

function repeatLast(name){
  const ex = data[name];
  if(!ex.entries.length) return;
  const last = ex.entries[ex.entries.length - 1];
  if(ex.trackBy === "duration"){
    const m = document.getElementById("f-minutes");
    if(m) m.value = last.minutes;
  } else {
    const w = document.getElementById("f-weight");
    const s = document.getElementById("f-sets");
    const r = document.getElementById("f-reps");
    if(w) w.value = last.weight;
    if(s) s.value = last.sets;
    if(r) r.value = last.reps;
  }
  const d = document.getElementById("f-difficulty");
  if(d && last.difficulty) d.value = last.difficulty;
}

function chartValue(e, ex){
  if(ex.trackBy === "weight") return e.weight;
  if(ex.trackBy === "duration") return e.minutes;
  return e.reps;
}

function suggestionValue(suggestion, ex){
  if(ex.trackBy === "weight") return suggestion.weight;
  if(ex.trackBy === "duration") return suggestion.minutes;
  return suggestion.reps;
}

// Retroactively flags any point where the weight dropped right after a
// 3+ session stall at the prior weight — i.e. a deload, whether the user
// followed the app's suggestion exactly or just dropped weight themselves.
function computeDeloadFlags(ex){
  const entries = ex.entries;
  const flags = new Array(entries.length).fill(false);
  if(ex.trackBy !== "weight") return flags;
  const targetReps = effectiveTargetReps(ex);
  for(let i = 1; i < entries.length; i++){
    const prev = entries[i-1], cur = entries[i];
    if(cur.weight < prev.weight){
      let missStreak = 0;
      for(let j = i-1; j >= 0; j--){
        const e = entries[j];
        if(e.weight === prev.weight && e.reps < targetReps) missStreak++;
        else break;
      }
      if(missStreak >= 3) flags[i] = true;
    }
  }
  return flags;
}

// ---------- chart (pure inline SVG, no external library) ----------
function renderChart(ex, suggestion, isRealExercise){
  const W = 320, H = 130, padR = 14, padT = 10, padB = 20;
  const entries = ex.entries;
  const points = entries.map((e,i) => ({ x:i, y: chartValue(e, ex), entry:e }));
  const deloadFlags = isRealExercise ? computeDeloadFlags(ex) : new Array(entries.length).fill(false);
  const hasProjection = !!suggestion;
  const projY = hasProjection ? suggestionValue(suggestion, ex) : null;

  const allY = points.map(p=>p.y).concat(hasProjection ? [projY] : []);
  const forceStep = ex.trackBy === "weight" ? undefined : 1;
  const { lo, hi, step } = niceTicks(allY, forceStep);
  const tickValues = ticksBetween(lo, hi, step);

  // Left padding scales with how wide the y-axis labels actually are,
  // so large numbers (like total volume) don't overflow past the edge.
  const tickLabels = tickValues.map(v => String(v));
  const maxLabelLen = tickLabels.reduce((m,s) => Math.max(m, s.length), 1);
  const padL = 14 + maxLabelLen * 5.5;

  const n = points.length + (hasProjection ? 1 : 0);
  const xStep = n > 1 ? (W - padL - padR) / (n - 1) : 0;

  function xAt(i){ return padL + i * xStep; }
  function yAt(v){ return padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo || 1)); }

  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;

  // gridlines + y labels
  tickValues.forEach(v => {
    const y = yAt(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#E7E2D6" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${y+3}" font-size="8" fill="#78716C" text-anchor="end" font-family="IBM Plex Mono, monospace">${v}</text>`;
  });

  // solid line through actual points
  if(points.length > 1){
    const path = points.map((p,i) => `${i===0?'M':'L'}${xAt(i).toFixed(1)},${yAt(p.y).toFixed(1)}`).join(" ");
    svg += `<path d="${path}" fill="none" stroke="#C2761A" stroke-width="2.5"/>`;
  }
  // dots + x labels for actual points — deload gets a hollow red marker,
  // under 3 sets gets dark red, missed target reps gets red, extra reps/sets
  // (that actually hit target) gets green — each with a small sets×reps label
  points.forEach((p,i) => {
    const isDeload = deloadFlags[i];
    const targetReps = ex.targetReps || 8;
    const isUnder = isRealExercise && !isDeload && ex.trackBy !== "duration" && p.entry.sets < 3;
    const isMissed = isRealExercise && !isDeload && !isUnder && ex.trackBy !== "duration" && p.entry.reps < targetReps;
    const isExtra = isRealExercise && !isDeload && !isUnder && !isMissed && ex.trackBy !== "duration" &&
      (p.entry.reps > targetReps || p.entry.sets > 3);
    const titleText = `${fmtDate(p.entry.date)}: ${formatEntryValue(p.entry, ex)}${p.entry.note?" — "+p.entry.note:""}${isDeload?" — deload":""}${isExtra?" — extra volume":""}${isUnder?" — under 3 sets":""}${isMissed?" — missed target reps":""}`;

    function labelWithHalo(text, color){
      const labelY = Math.max(padT + 7, yAt(p.y) - 8);
      const w = text.length * 4.6 + 3;
      svg += `<rect x="${(xAt(i)-w/2).toFixed(1)}" y="${(labelY-6.5).toFixed(1)}" width="${w.toFixed(1)}" height="9" rx="2" fill="#FBFAF6" opacity="0.85"/>`;
      svg += `<text x="${xAt(i).toFixed(1)}" y="${labelY.toFixed(1)}" font-size="7.5" fill="${color}" font-weight="700" text-anchor="middle" font-family="IBM Plex Mono, monospace">${text}</text>`;
    }

    if(isDeload){
      svg += `<line x1="${xAt(i).toFixed(1)}" y1="${padT}" x2="${xAt(i).toFixed(1)}" y2="${H-padB}" stroke="#B3261E" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>`;
      svg += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" r="5" fill="#fff" stroke="#B3261E" stroke-width="2"><title>${titleText}</title></circle>`;
    } else if(isUnder){
      svg += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" r="4.5" fill="#D32F2F"><title>${titleText}</title></circle>`;
      labelWithHalo(`${p.entry.sets}×${p.entry.reps}`, "#D32F2F");
    } else if(isMissed){
      svg += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" r="4.5" fill="#6B1F1F"><title>${titleText}</title></circle>`;
      labelWithHalo(`${p.entry.sets}×${p.entry.reps}`, "#6B1F1F");
    } else if(isExtra){
      svg += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" r="4.5" fill="#0B4F37"><title>${titleText}</title></circle>`;
      labelWithHalo(`${p.entry.sets}×${p.entry.reps}`, "#0B4F37");
    } else {
      svg += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" r="4" fill="#C2761A"><title>${titleText}</title></circle>`;
    }
    svg += `<text x="${xAt(i).toFixed(1)}" y="${H-4}" font-size="8" fill="${isDeload?'#B3261E':'#78716C'}" text-anchor="middle" font-family="IBM Plex Mono, monospace">${isDeload?'D':p.entry.label}</text>`;
  });

  // dashed projection segment
  if(hasProjection && points.length){
    const lastP = points[points.length-1];
    const x1 = xAt(points.length-1), y1 = yAt(lastP.y);
    const x2 = xAt(points.length), y2 = yAt(projY);
    svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#C2761A" stroke-width="2" stroke-dasharray="5 4"/>`;
    const projLabel = ex.trackBy==="weight" ? `${suggestion.weight}lbs ${repLabel(suggestion.sets,suggestion.reps,ex.unit)}` : ex.trackBy==="duration" ? `${suggestion.minutes} min` : repLabel(suggestion.sets,suggestion.reps,ex.unit);
    svg += `<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="4" fill="#fff" stroke="#C2761A" stroke-width="2"><title>Suggested next: ${projLabel}</title></circle>`;
    svg += `<text x="${x2.toFixed(1)}" y="${H-4}" font-size="8" fill="#C2761A" text-anchor="middle" font-family="IBM Plex Mono, monospace">Next</text>`;
  }

  svg += `</svg>`;
  return svg;
}

// ---------- overview ----------
function guessDayForNames(names){
  let best = null, bestOverlap = 0;
  ["full","upper","lower","extra"].forEach(d => {
    const overlap = DAY_ORDER[d].filter(n => names.includes(n)).length;
    if(overlap > bestOverlap){ bestOverlap = overlap; best = d; }
  });
  return best;
}

function getSessionsByDate(){
  const map = {};
  Object.entries(data).forEach(([name, ex]) => {
    ex.entries.forEach(e => {
      if(!e.date) return;
      if(!map[e.date]) map[e.date] = [];
      if(!map[e.date].includes(name)) map[e.date].push(name);
    });
  });
  return map;
}

const CAL_MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const CAL_DAY_LETTERS = { full:"F", upper:"U", lower:"L", extra:"E" };
const CAL_DAY_COLORS = { full:"var(--pine)", upper:"var(--amber)", lower:"var(--emerald)", extra:"var(--slate)" };

function prevMonth(){
  calendarMonth--;
  if(calendarMonth < 0){ calendarMonth = 11; calendarYear--; }
  calendarSelectedDate = null;
  render();
}
function nextMonth(){
  calendarMonth++;
  if(calendarMonth > 11){ calendarMonth = 0; calendarYear++; }
  calendarSelectedDate = null;
  render();
}
function selectCalendarDate(dateStr){
  calendarSelectedDate = calendarSelectedDate === dateStr ? null : dateStr;
  render();
}
function toggleCalendarExpanded(){
  calendarExpanded = !calendarExpanded;
  render();
}
function toggleLastSessionExpanded(){
  lastSessionExpanded = !lastSessionExpanded;
  render();
}
function toggleVolumeExpanded(){
  volumeExpanded = !volumeExpanded;
  render();
}

function renderCalendar(){
  const sessionsByDate = getSessionsByDate();
  const firstOfMonth = new Date(calendarYear, calendarMonth, 1);
  const daysInMonth = new Date(calendarYear, calendarMonth+1, 0).getDate();
  const startWeekday = firstOfMonth.getDay();
  const todayStr = todayISO();
  const monthPrefix = `${calendarYear}-${String(calendarMonth+1).padStart(2,"0")}-`;
  const sessionsThisMonth = Object.keys(sessionsByDate).filter(d => d.startsWith(monthPrefix)).length;

  let html = `<div class="card">`;
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${calendarExpanded?'0.6rem':'0'};">
    <button class="tool-btn" onclick="prevMonth()">‹ Prev</button>
    <h3 class="section" style="margin:0;">${CAL_MONTH_NAMES[calendarMonth]} ${calendarYear}</h3>
    <button class="tool-btn" onclick="nextMonth()">Next ›</button>
  </div>`;

  html += `<div onclick="toggleCalendarExpanded()" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:0.78rem;color:var(--slate);padding:${calendarExpanded?'0':'0.3rem 0'};">
    <span>${sessionsThisMonth} session${sessionsThisMonth===1?'':'s'} this month</span>
    <span style="color:var(--amber);font-weight:600;">${calendarExpanded ? 'Hide calendar ▲' : 'Show calendar ▼'}</span>
  </div>`;

  if(calendarExpanded){
    html += `<div class="cal-grid cal-header" style="margin-top:0.5rem;">` + ["S","M","T","W","T","F","S"].map(d => `<div>${d}</div>`).join("") + `</div>`;
    html += `<div class="cal-grid">`;
    for(let i = 0; i < startWeekday; i++) html += `<div class="cal-cell empty"></div>`;
    for(let day = 1; day <= daysInMonth; day++){
      const dateStr = `${calendarYear}-${String(calendarMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const namesLogged = sessionsByDate[dateStr];
      const dayType = namesLogged ? guessDayForNames(namesLogged) : null;
      const letter = dayType ? CAL_DAY_LETTERS[dayType] : "";
      const color = dayType ? CAL_DAY_COLORS[dayType] : "transparent";
      const isToday = dateStr === todayStr;
      const isSelected = dateStr === calendarSelectedDate;
      html += `<div class="cal-cell${isToday?' today':''}${namesLogged?' has-session':''}${isSelected?' selected':''}" ${namesLogged ? `onclick="selectCalendarDate('${dateStr}')"` : ''}>
        <span class="cal-daynum">${day}</span>
        ${letter ? `<span class="cal-badge" style="background:${color};">${letter}</span>` : ''}
      </div>`;
    }
    html += `</div>`;

    if(calendarSelectedDate && sessionsByDate[calendarSelectedDate]){
      const names = sessionsByDate[calendarSelectedDate];
      html += `<div class="cal-detail"><p style="font-weight:600;font-size:0.8rem;margin:0 0 0.35rem;">${fmtDate(calendarSelectedDate)}</p>`;
      names.forEach(n => {
        const ex = data[n];
        const entry = ex.entries.slice().reverse().find(e => e.date === calendarSelectedDate);
        if(entry){
          html += `<div style="font-size:0.78rem;color:var(--slate);font-family:'IBM Plex Mono',monospace;">${n} — ${formatEntryValue(entry, ex)}</div>`;
        }
      });
      html += `</div>`;
    }

    const legendTitles = { ...DAY_TITLES, extra: "Extra" };
    html += `<div class="cal-legend">`;
    Object.keys(CAL_DAY_LETTERS).forEach(d => {
      html += `<span><span class="cal-badge" style="background:${CAL_DAY_COLORS[d]};">${CAL_DAY_LETTERS[d]}</span> ${legendTitles[d]}</span>`;
    });
    html += `</div>`;
  }

  const recovery = computeRecoveryReadiness();
  if(recovery){
    const readinessColor = recovery.readiness >= 7 ? "var(--emerald)" : recovery.readiness >= 4 ? "var(--amber)" : "#B3261E";
    html += `<p style="font-size:0.76rem;color:var(--slate);margin:0.6rem 0 0;padding-top:0.5rem;border-top:1px dashed var(--line);">
      Recovery readiness: <b style="color:${readinessColor};font-family:'IBM Plex Mono',monospace;">${recovery.readiness}/10</b>
      — ${recovery.daysSince} day${recovery.daysSince===1?'':'s'} rested${recovery.neededRestDays > 0 ? `, ~${recovery.neededRestDays} more suggested` : ', should be ready'}
    </p>`;
  }

  html += `</div>`;
  return html;
}

function getLastSessionDate(){
  let maxDate = null;
  Object.values(data).forEach(ex => ex.entries.forEach(e => {
    if(e.date && (!maxDate || e.date > maxDate)) maxDate = e.date;
  }));
  return maxDate;
}

function generateCoachNotes(){
  const lastDate = getLastSessionDate();
  if(!lastDate) return null;

  const items = [];
  Object.entries(data).forEach(([name, ex]) => {
    for(let i = ex.entries.length - 1; i >= 0; i--){
      if(ex.entries[i].date === lastDate){
        const entry = ex.entries[i];
        const prev = ex.entries[i-1] || null;
        let trend = "first";
        if(prev){
          if(ex.trackBy === "weight") trend = entry.weight > prev.weight ? "increased" : entry.weight < prev.weight ? "decreased" : "held";
          else trend = entry.reps > prev.reps ? "increased" : entry.reps < prev.reps ? "decreased" : "held";
        }
        const targetReps = ex.targetReps || 8;
        const hit = ex.trackBy === "weight" ? entry.reps >= targetReps : true;
        items.push({ name, entry, trend, hit, ex });
        break;
      }
    }
  });
  if(!items.length) return null;

  // Guess which day type this session matches best, just for the opening line
  const dayGuess = guessDayForNames(items.map(i => i.name));
  const dayLabel = dayGuess ? DAY_TITLES[dayGuess] : "Last session";

  const total = items.length;
  const hitCount = items.filter(i => i.hit).length;
  const increased = items.filter(i => i.trend === "increased");
  const missed = items.filter(i => !i.hit);
  const concernWords = ["heavy","tender","grip","pain","sore","ache","hurt"];
  const concerns = items.filter(i => i.entry.note && concernWords.some(w => i.entry.note.toLowerCase().includes(w)));

  const sentences = [];
  sentences.push(`${dayLabel} on ${fmtDate(lastDate)} — ${hitCount}/${total} lifts hit target clean.`);

  if(increased.length){
    const names = increased.slice(0,2).map(i => i.name).join(" and ");
    sentences.push(`${names} moved up in weight and still landed it — good sign, keep building there.`);
  }
  if(missed.length){
    const names = missed.slice(0,2).map(i => i.ex.trackBy==="weight" ? `${i.name} (${i.entry.weight}lbs)` : i.name).join(" and ");
    sentences.push(`${names} missed target — hold steady there next time instead of adding more.`);
  }
  if(concerns.length){
    const c = concerns[0];
    sentences.push(`Worth flagging: ${c.name} noted "${escapeHtml(c.entry.note)}" — keep an eye on that rather than pushing through it.`);
  }
  if(!missed.length && !concerns.length && hitCount === total){
    sentences.push(increased.length ? `Clean session across the board — nothing to dial back here.` : `Solid and consistent — everything landed, nothing urgent to change.`);
  }
  if(skiSeasonMode && (dayGuess === "lower" || dayGuess === "full")){
    sentences.push(`🎿 Ski season is on — keep leaning into single-leg work and a controlled lowering phase on squat/split squat/lunge.`);
  }

  return sentences.join(" ");
}

function renderLastSessionBreakdown(){
  const lastDate = getLastSessionDate();
  if(!lastDate) return "";
  const sessionsByDate = getSessionsByDate();
  const names = sessionsByDate[lastDate];
  if(!names || !names.length) return "";

  let html = `<div onclick="toggleLastSessionExpanded()" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:0.78rem;color:var(--slate);margin-top:0.6rem;padding-top:0.5rem;border-top:1px dashed var(--line);">
    <span>${names.length} exercise${names.length===1?'':'s'} logged</span>
    <span style="color:var(--amber);font-weight:600;">${lastSessionExpanded ? 'Hide breakdown ▲' : 'Show breakdown ▼'}</span>
  </div>`;

  if(lastSessionExpanded){
    html += `<div style="margin-top:0.5rem;">`;
    names.forEach(n => {
      const ex = data[n];
      const entry = ex.entries.slice().reverse().find(e => e.date === lastDate);
      if(entry){
        html += `<div class="session-row">
          <span>${n}</span>
          <span class="exact">${formatEntryValue(entry, ex)}</span>
          <span class="exact">${entry.difficulty ?? "—"}</span>
        </div>`;
      }
    });
    html += `</div>`;
  }

  return html;
}

function renderOverview(){
  const app = document.getElementById("app");
  const overviewData = Object.entries(data).map(([name, ex]) => {
    if(ex.entries.length < 2) return null;
    const f = ex.entries[0], l = ex.entries[ex.entries.length-1];
    const firstVal = ex.trackBy==="weight" ? f.weight : f.reps;
    const lastVal = ex.trackBy==="weight" ? l.weight : l.reps;
    if(!firstVal) return null;
    const pct = ((lastVal-firstVal)/firstVal)*100;
    return { name, pct, firstVal, lastVal, trackBy: ex.trackBy };
  }).filter(Boolean).sort((a,b) => b.pct - a.pct);

  const avgPct = overviewData.length ? overviewData.reduce((s,o)=>s+o.pct,0)/overviewData.length : 0;
  const totalSessions = Object.values(data).reduce((s,ex)=>s+ex.entries.length,0);
  const progressing = overviewData.filter(o=>o.pct>0).length;
  const holding = overviewData.filter(o=>o.pct===0).length;
  const declining = overviewData.filter(o=>o.pct<0).length;

  const dayAgg = ["full","upper","lower"].map(day => {
    const names = DAY_ORDER[day];
    const relevant = overviewData.filter(o => names.includes(o.name));
    const avg = relevant.length ? relevant.reduce((s,o)=>s+o.pct,0)/relevant.length : null;
    return { day, title: DAY_TITLES[day], avg, count: relevant.length, total: names.length };
  });

  const coachNotes = generateCoachNotes();

  let html = "";
  if(coachNotes){
    html += `<div class="card" style="border-color:var(--amber-light);background:#FFFCF6;">
      <h3 class="section" style="color:var(--amber);">🎯 Coach's Notes</h3>
      <p style="font-size:0.85rem;line-height:1.5;color:var(--ink);margin:0;">${coachNotes}</p>
      ${renderLastSessionBreakdown()}
    </div>`;
  }

  html += renderCalendar();

  html += `<div class="card">
    <h3 class="section">Aggregate Progress</h3>
    <div class="ov-grid">
      <div><div class="n" style="color:var(--emerald)">${avgPct>0?'+':''}${avgPct.toFixed(0)}%</div><div class="l">avg change</div></div>
      <div><div class="n">${totalSessions}</div><div class="l">sets logged</div></div>
      <div><div class="n">${overviewData.length}</div><div class="l">lifts tracked</div></div>
    </div>
    <div style="display:flex;gap:0.6rem;font-size:0.72rem;margin-bottom:0.8rem;">
      <span style="color:var(--emerald);font-weight:600;">▲ ${progressing} progressing</span>
      <span style="color:var(--slate);font-weight:600;">● ${holding} holding</span>
      <span style="color:var(--amber);font-weight:600;">▼ ${declining} below first logged</span>
    </div>
    <div style="border-top:1px dashed var(--line);padding-top:0.7rem;">
      <h3 class="section">Net Change by Day</h3>
      <div class="ov-grid">`;
  dayAgg.forEach(d => {
    const color = d.avg===null ? "var(--slate)" : d.avg>0 ? "var(--emerald)" : d.avg<0 ? "var(--amber)" : "var(--slate)";
    html += `<div><div class="n" style="color:${color}">${d.avg===null?'—':(d.avg>0?'+':'')+d.avg.toFixed(0)+'%'}</div><div class="l">${d.title}</div><div style="font-size:0.62rem;color:var(--slate);">${d.count}/${d.total} lifts w/ data</div></div>`;
  });
  html += `</div></div></div>`;

  html += `<div class="card">`;
  html += `<div onclick="toggleVolumeExpanded()" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
    <h3 class="section" style="margin:0;">Volume Trends by Day</h3>
    <span style="font-size:0.78rem;color:var(--amber);font-weight:600;">${volumeExpanded ? 'Hide ▲' : 'Show ▼'}</span>
  </div>`;
  if(!volumeExpanded){
    html += `<div style="margin-top:0.5rem;">`;
    ["full","upper","lower"].forEach(day => {
      const history = calcDayVolumeHistory(day);
      const latest = history.length ? history[history.length-1].weight : null;
      const prev = history.length > 1 ? history[history.length-2].weight : null;
      const pct = (latest !== null && prev) ? ((latest - prev) / prev) * 100 : null;
      const pctColor = pct === null ? "var(--slate)" : pct > 0 ? "var(--emerald)" : pct < 0 ? "var(--amber)" : "var(--slate)";
      const pctText = pct === null ? "—" : `${pct>0?'+':''}${pct.toFixed(0)}%`;
      html += `<div class="session-row">
        <span>${DAY_TITLES[day]}</span>
        <span class="exact">${latest !== null ? latest.toLocaleString()+" lbs" : "—"}</span>
        <span class="exact" style="color:${pctColor};">${pctText}</span>
      </div>`;
    });
    html += `</div>`;
  } else {
    ["full","upper","lower"].forEach(day => {
      const history = calcDayVolumeHistory(day);
      html += `<div style="margin-top:0.9rem;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <span style="font-weight:600;font-size:0.85rem;">${DAY_TITLES[day]}</span>
          ${history.length ? `<span style="font-family:'IBM Plex Mono',monospace;font-size:0.76rem;color:var(--slate);">${history[history.length-1].weight.toLocaleString()} lbs last session</span>` : ''}
        </div>`;
      if(history.length){
        html += renderChart({ trackBy:"weight", entries: history }, null);
      } else {
        html += `<p style="font-size:0.78rem;color:var(--slate);font-style:italic;margin:0.3rem 0 0;">No sessions logged yet.</p>`;
      }
      html += `</div>`;
    });
  }
  html += `</div>`;

  html += `<div class="card"><h3 class="section">% Change Since First Logged</h3>`;
  if(!overviewData.length){
    html += `<p style="font-size:0.85rem;color:var(--slate);font-style:italic;">Need at least 2 sessions on a lift to show change.</p>`;
  } else {
    overviewData.forEach(o => {
      const color = o.pct>0 ? "var(--emerald)" : o.pct<0 ? "var(--amber)" : "var(--slate)";
      const width = Math.min(Math.abs(o.pct),100);
      const freq = frequencyLabel(data[o.name]);
      html += `<div class="bar-row">
        <div class="top"><span style="font-weight:500;">${o.name}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:${color};">${o.pct>0?'+':''}${o.pct.toFixed(0)}% · ${o.firstVal}→${o.lastVal}${o.trackBy==='weight'?'lbs':' reps'}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${width}%;background:${color};"></div></div>
        ${freq ? `<div style="font-size:0.66rem;color:var(--slate);margin-top:0.15rem;">${freq}</div>` : ''}
      </div>`;
    });
  }
  html += `</div>`;

  html += `<div class="card${skiSeasonMode ? ' ski-mode' : ''}">
    <h3 class="section">🎿 Ski Season</h3>
    <p style="font-size:0.78rem;color:var(--slate);margin:0 0 0.7rem;">
      When on, Squat, Bulgarian Split Squat, and Walking Lunge shift to lower rep targets with a slower eccentric tempo and more single-leg emphasis. Everything else keeps training as normal. Roughly Nov-March.
    </p>
    <button class="tool-btn" onclick="toggleSkiSeason()" style="background:${skiSeasonMode ? '#1565C0' : ''};color:${skiSeasonMode ? '#fff' : ''};border-color:${skiSeasonMode ? '#1565C0' : ''};">
      ${skiSeasonMode ? '🎿 Ski Season: ON' : '🎿 Ski Season: OFF'}
    </button>
  </div>`;

  html += `<div class="card">
    <h3 class="section">Backup &amp; Restore</h3>
    <div class="header-tools">
      <button class="tool-btn" onclick="backupData()">⬇ Backup data</button>
      <button class="tool-btn" onclick="document.getElementById('restore-input').click()">⬆ Restore backup</button>
      <input type="file" id="restore-input" accept="application/json" style="display:none" onchange="restoreData(event)">
    </div>
    <p id="tool-status" style="font-size:0.68rem;color:var(--slate);margin:0.5rem 0 0;"></p>
  </div>`;

  app.innerHTML = html;
}

// ---------- interactions ----------
function selectExercise(name){
  const oldContainer = document.getElementById("pill-scroll");
  const savedScrollLeft = oldContainer ? oldContainer.scrollLeft : 0;
  selected = name;
  render();
  const newContainer = document.getElementById("pill-scroll");
  if(newContainer) newContainer.scrollLeft = savedScrollLeft;
}
function toggleHistory(name){ openHistory[name] = !openHistory[name]; render(); }
function toggleAddExercise(){
  const row = document.getElementById("add-ex-row");
  row.style.display = row.style.display === "none" ? "flex" : "none";
}
function addExercise(){
  const input = document.getElementById("new-ex-name");
  const name = input.value.trim();
  if(!name || data[name]) return;
  data[name] = { trackBy:"weight", entries:[], day: view };
  selected = name;
  persist();
  render();
}
function cssId(name){ return name.replace(/[^a-z0-9]/gi,"-"); }
function escapeHtml(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function logEntry(){
  const ex = data[selected];
  const dateEl = document.getElementById("f-date");
  const noteEl = document.getElementById("f-note");
  const difficultyEl = document.getElementById("f-difficulty");
  const difficulty = difficultyEl && difficultyEl.value ? Math.max(1, Math.min(10, Number(difficultyEl.value))) : null;

  let entry;
  if(ex.trackBy === "duration"){
    const minutesEl = document.getElementById("f-minutes");
    if(!minutesEl || !minutesEl.value) return;
    entry = {
      label: "S" + (ex.entries.length + 1),
      date: dateEl.value || todayISO(),
      confirmed: true,
      minutes: Number(minutesEl.value),
      difficulty,
      note: (noteEl.value || "").trim(),
    };
  } else {
    const isBodyweight = ex.trackBy === "reps";
    const weightEl = document.getElementById("f-weight");
    const setsEl = document.getElementById("f-sets");
    const repsEl = document.getElementById("f-reps");

    const sets = Number(setsEl.value) || 3;
    const reps = Number(repsEl.value) || effectiveTargetReps(ex);
    const weight = isBodyweight ? 0 : Number(weightEl.value);

    if(!isBodyweight && !weightEl.value) return;

    entry = {
      label: "S" + (ex.entries.length + 1),
      date: dateEl.value || todayISO(),
      confirmed: true,
      weight, sets, reps,
      difficulty,
      note: (noteEl.value || "").trim(),
    };
  }
  ex.entries.push(entry);
  persist();
  render();

  const btn = document.querySelector(".log");
  if(btn){
    const originalText = btn.textContent;
    btn.classList.add("log-confirmed");
    btn.textContent = "Logged ✓";
    setTimeout(() => {
      btn.classList.remove("log-confirmed");
      btn.textContent = originalText;
    }, 1600);
  }
}

render();
</script>
</body>
</html>
