name: Deploy coach function

# Deploys the Supabase edge function whenever it changes on main, so nobody has to paste the
# whole file into a deploy tool. Needs one repository secret: SUPABASE_ACCESS_TOKEN (a personal
# access token from supabase.com/dashboard/account/tokens). Without it the job explains and skips.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: eixbpujqsectkstkqllz
    steps:
      - uses: actions/checkout@v4

      - name: Check for the access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so the coach function was not deployed. Add it under Settings > Secrets and variables > Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest

      # verify_jwt stays off: the function checks the caller's session itself (see its header).
      - name: Deploy coach
        if: steps.token.outputs.ok == 'true'
        run: supabase functions deploy coach --project-ref "$PROJECT_REF" --no-verify-jwt
